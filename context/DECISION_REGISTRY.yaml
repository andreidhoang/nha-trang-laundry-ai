      channel_send_receipts.resolution_note, staff_users.display_name and email,
      contact_channel_bindings.provider_user_ref, and the jsonb payload columns on
      approval_requests, outbox_events, domain_events and command_idempotency_records. The owner
      decides which class an AI draft belongs to, whether a human's edit inherits it, and whether
      the remaining columns are deliberately out of scope.
    blocking_today: >-
      Nothing, because none of those columns holds real customer data yet. SHADOW-001 is the point
      at which that stops being true, so the obligation attaches before that item, not after it.
  - id: DEC-020
    title: Which identity may execute a retention purge, and what the database grants it
    status: OPEN
    owner: BUSINESS_OWNER
    affected_capabilities: [INTERNAL_SHADOW]
    fail_closed_behavior: NOT_SUPPORTED
    source: docs/DECISION_REQUEST_RETENTION_EXECUTION_2026-08.md
    opened_at: '2026-08-18'
    question: >-
      No GRANT, REVOKE, CREATE ROLE or ROW LEVEL SECURITY statement exists anywhere in migrations
      0001 to 0027, and scripts/apply_demo_grants.py REVOKEs DELETE, TRUNCATE, REFERENCES and
      TRIGGER on all tables from the API and worker roles, with a test pinning that behaviour. A
      purge is a DELETE, so no identity in this system can execute one. SECURITY_RELIABILITY_SPEC_V1
      section 9.4 requires deletion of raw inbox data to be audited AND restricted; the audited half
      is built and the restricted half does not exist. The owner decides which identity purges,
      whether a purge may run unattended at all, and whether the disposable side tables should be
      the only tables in the schema with DELETE granted to anyone.
    blocking_today: >-
      No purge can execute regardless of schedule, which is fail-closed and correct. It also means
      RETENTION-STORE-001 cannot be completed by engineering alone, which is why it is recorded as a
      blocker rather than worked around.
  - id: DEC-021
    title: When a quote becomes final, who may make it so, and how that is recorded
    status: RESOLVED
    owner: BUSINESS_OWNER
    affected_capabilities: [INTERNAL_SHADOW]
    fail_closed_behavior: NOT_SUPPORTED
    source: docs/DECISION_REQUEST_QUOTE_APPROVAL_2026-08.md
    opened_at: '2026-08-21'
    question: >-
      No command path in this system can produce a quote revision that order creation will accept.
      OrderRepository.create requires finality APPROVED_EXACT and status ACCEPTED_FINAL with a
      non-null approval_id (orders.py:126-137); compose_quote_revision hardcodes ESTIMATE,
      REVIEW_REQUIRED and approval_id None on every path (quote_composition.py:232-233, 254-255);
      quotes.py:133 is the sole INSERT and a trigger forbids UPDATE, so a revision must be born
      orderable rather than promoted; and approving an envelope never touches a quote row. Verified
      live 2026-08-21: POST orders returns 409 for every quote the engine can produce, and three
      independent attempts to refute the chain failed. The owner decides what "chốt giá" means at
      the counter, who may do it, and whether the unresolved delivery fee (DEC-003) or the
      TAX_TREATMENT_UNVERIFIED flag must clear first.
    blocking_today: >-
      Every order in the business. No order can be created by any route, screen or operator action,
      so the order board, the transition command and the settlement command are all reachable code
      over a table nothing can put a row into. SHADOW-001, the G1 evidence carrier, requires thirty
      real orders and its task packet does not list order creation among the conditions before the
      first order; no work item among the 82 in the queue owns this. The console discloses the
      refusal under CONSOLE-ORDER-GAP-001 and no code routes around it.
    resolved_at: '2026-08-25'
    decision_record: docs/DECISION_REQUEST_QUOTE_APPROVAL_2026-08.md
    resolution: >-
      Owner ratified the engineering recommendation on record — questions 1 and 2 of the packet,
      option A, staff attestation — in Vietnamese on 2026-08-25: "Một bản báo giá được coi là đã
      chốt khi nhân viên có tên xác nhận rằng khách đã đồng ý với mức giá đã đọc. Hệ thống ghi lại
      lời xác nhận đó kèm tên người xác nhận, không tự suy ra." and "Nhân viên đang trực quầy được
      chốt giá. Mỗi lần chốt ghi tên người chốt, không sửa được, và chủ tiệm xem lại được toàn bộ."

      The authority is recorded rather than inferred, following the precedent SETTLEMENT-001 set: a
      fact a named staff member witnesses at the counter, written as an attributed append-only
      attestation. One person suffices. The control is attribution, immutability and owner review
      rather than a second signature, because a shift with one person on duty is a real shift and a
      system that blocks it would be worked around on paper — which would cost the shop both the
      control and the record.

      Question 3 needed no decision: the delivery fee schedule was already decided (DEC-003 for over
      6km, plus the owner-confirmed schedule under it) and QUOTE-DELIVERY-FEE-001 wired the engine
      into the quote path on 2026-08-24. Question 4 was answered in the same message and is
      registered separately as DEC-022, because it is a distinct policy about tax rather than about
      when a price becomes final.
  - id: DEC-022
    title: Whether unverified tax treatment blocks accepting an order
    status: RESOLVED
    owner: BUSINESS_OWNER
    affected_capabilities: [INTERNAL_SHADOW]
    fail_closed_behavior: NOT_SUPPORTED
    source: docs/DECISION_REQUEST_QUOTE_APPROVAL_2026-08.md
    opened_at: '2026-08-25'
    question: >-
      Every quote revision carries TAX_TREATMENT_UNVERIFIED in required_approvals
      (quote_composition.py BASE_REQUIRED_APPROVALS), and quotes.py:500 refuses APPROVED_EXACT while
      required_approvals is non-empty. So the flag is a third independent reason no order can be
      created, alongside DEC-021 and the delivery fee. Searching every entry of this registry on
      2026-08-24 found no decision about tax at all: it was an unregistered blocker, surfaced as
      question 4 of the DEC-021 packet rather than as an entry here. The owner decides whether tax
      treatment is a condition of accepting an order or an accounting matter handled afterwards.
    blocking_today: >-
      Registered and resolved in the same change, so it blocked nothing between opening and
      resolution. Before it was registered it was blocking every order in the business as one of
      three independent causes.
    resolved_at: '2026-08-25'
    decision_record: docs/DECISION_REQUEST_QUOTE_APPROVAL_2026-08.md
    resolution: >-
      Owner ratified the engineering recommendation on record — question 4 of the packet — in
      Vietnamese on 2026-08-25: "Cách xử lý thuế là việc kế toán làm sau khi đơn hoàn tất, không phải
      điều kiện để nhận đơn. Cờ TAX_TREATMENT_UNVERIFIED được gỡ khỏi điều kiện chốt giá và ghi lại
      như một ghi chú kế toán."

      TAX_TREATMENT_UNVERIFIED therefore leaves required_approvals and stays in reason_codes. The
      distinction is deliberate and is the whole content of the decision: a reason code is a fact
      recorded on the immutable revision for whoever reads it later, while required_approvals is a
      gate the machine enforces. The flag remains true and remains visible; it stops being a
      condition of taking the customer's laundry.

      Not decided here: what the correct tax treatment is. That stays unverified, is still stamped on
      every revision, and is the accountant's to settle. This decision says only that settling it is
      not a precondition of accepting an order.
  - id: DEC-023
    title: When and how a delivery order is paid for, and who records that it arrived
    status: RESOLVED
    owner: BUSINESS_OWNER
    affected_capabilities: [INTERNAL_SHADOW, DELIVERY_ADVISORY, BOOKING]
    fail_closed_behavior: NOT_SUPPORTED
    source: docs/DECISION_REQUEST_DELIVERY_COMPLETION_2026-08.md
    opened_at: '2026-08-26'
    question: >-
      Measured on 2026-08-26 by running the full lifecycle against the live database for both
      fulfilment modes. Self-collection completes end to end. A delivery order is priced, agreed,
      taken and washed, then stops at two refusals: `settlement shape is not supported`, because
      `evaluate_settlement` accepts only goods handed back at the counter (DEC-010, resolved
      2026-08-18 as deliberately deferred, when delivery was not in view); and
      `INVALID_STATE_TRANSITION: fulfillment is incomplete`, because
      `orders.required_delivery_legs_succeeded` is read in three places, defaults FALSE and is
      written nowhere.

      The two are coupled, which is why they are one decision. Building the delivery-leg writer
      (FULFILMENT-001, decision-clear on DEC-003 since 2026-08-18 and never enqueued) without
      deciding the settlement question ships a delivery order that reaches "delivered, unpaid,
      permanently ACTIVE" -- worse than today, because it looks finished. And the coupling runs both
      ways: whether the driver collects cash decides what a delivery leg must record, so the record
      cannot be designed before the answer. The owner decides when a delivery customer pays, who
      confirms the goods arrived, and what happens when delivery fails.
    blocking_today: >-
      Delivery orders. They can be taken, priced, agreed and worked, and then cannot be settled or
      closed. The walk-in path is unaffected and complete. FULFILMENT-001 stays unenqueued rather
      than being built against a guess.
    resolved_at: '2026-08-26'
    decision_record: docs/DECISION_REQUEST_DELIVERY_COMPLETION_2026-08.md
    resolution: >-
      **Question 1 — owner's choice.** The owner ratified the engineering recommendation on record,
      option A: khách giao hàng trả trước tại quầy. The customer pays the exact quoted total at the
      counter when the laundry is handed over, before it leaves the shop. No driver carries money,
      no cash is reconciled at the end of a day, and the shop is never owed money by somebody
      holding its laundry.

      This adds a second settlement shape, `EXACT_PAYMENT_PREPAID_DELIVERY`, and that is the change
      the code itself asked to be deliberate about: `SettlementShape` carries the comment "An enum
      of one, so adding a second is a visible decision." This entry is that visible decision.

      It reopens nothing. `DEC-010` deferred partial payment, deposits, instalments and ON_ACCOUNT
      credit — all shapes about *amount* or *credit*, none of which this is. Exact payment in full
      is precisely the shape `DEC-010` kept. The refusal that blocked delivery,
      `COLLECTION_WAS_NOT_BY_THE_CUSTOMER`, is attributed in `REFUSAL_DECISIONS` to `DEC-003`, not
      to `DEC-010` — it was always waiting on the delivery work rather than on a money decision.

      **Questions 2 and 3 — engineering consequences, not the owner's words.** Both follow from
      question 1 plus this system's own precedent, and are recorded here as derived so a later
      reader can tell them apart from what was ratified.

      *Who confirms the goods arrived:* a named staff member records it, exactly as settlement,
      quote acceptance and counter tickets are recorded. With payment already taken at the counter,
      a delivery leg carries no money and no financial risk, so it is an ordinary attributed
      attestation. A driver-facing surface — a mobile app, a roadside login, a driver identity —
      is a separate decision nobody has asked for, and no such surface exists.

      *A delivery that fails:* the attempt is recorded as a failed leg, nothing is charged, and the
      order stays `ACTIVE` with the goods back at the shop. A retry is a new leg row rather than an
      edit, because legs are append-only. Charging a second delivery fee automatically would be
      this system deciding money, which it must not; if the shop wants to charge for a second
      attempt, staff negotiate it as they do any fee over 6km under `DEC-003`.

      If either derived answer is wrong about how the shop actually works, it is a correction to
      make, not a decision to re-run.
  - id: DEC-024
    title: How an order leaves the system when the normal path does not apply
    status: OPEN
    owner: BUSINESS_OWNER
    affected_capabilities: [INTERNAL_SHADOW, ORDER_STATUS, BOOKING]
    fail_closed_behavior: REQUIRE_HUMAN
    source: docs/DECISION_REQUEST_ORDER_EXIT_2026-08.md
    opened_at: '2026-08-31'
    question: >-
      Two defects in the same family, both measured on 2026-08-31 and both week-one counter events.
      Production `EXCEPTION` has zero outgoing edges: `transition_production` tests
      `current in {RELEASED, EXCEPTION}` before any exit is reachable and discards
      `production_resume_status`, so a paid order interrupted by a stain or a machine fault can
      never reach any terminal state. And `CONFIRMED -> CANCELLED` has no guard at all, while the
      one guarded cancellation path is unreachable because `cancellation_approved` and
      `custody_and_financial_resolution_recorded` default false and no caller ever passes them --
      so the reviewed path always refuses and the unreviewed path always succeeds. An order can be
      cancelled after the laundry is washed and released, with the money never recorded. The owner
      decides whether an exception is resumable, what must be true before a started order may be
      cancelled, whether the customer is refunded, and who hands the goods back.
    blocking_today: >-
      An order that hits a production exception cannot be closed or cancelled by anyone, and a late
      cancellation loses the money silently. `ORDER-EXIT-001` is written and deliberately not
      started; `SHOP-CUTOVER-001` does not proceed while this is open, because both cases occur in
      the first week of real counter operation.
  - id: DEC-025
    title: Who is told when the shop's software is in trouble
    status: OPEN
    owner: BUSINESS_OWNER
    affected_capabilities: [INTERNAL_SHADOW]
    fail_closed_behavior: NOT_SUPPORTED
    source: docs/DECISION_REQUEST_ALERT_ROUTING_2026-09.md
    opened_at: '2026-09-03'
    question: >-
      `SHOP-OBSERVABILITY-001` built four checks that can genuinely fail on the R1 deployment, and
      nothing carries their result to a person. Every way of delivering one adds a counterparty and
      a credential -- an SMTP account, a messaging bot token, a paging provider -- and R1
      deliberately has none of those. The owner decides which failures warrant waking somebody, at
      what hour, through which account, and whose account it is. Two of the four will not announce
      themselves: a WAL archive gap means the recovery guarantee is silently gone, and a filling
      database volume ends with PostgreSQL refusing writes and the counter unable to take an order.
    blocking_today: >-
      Nothing is blocked. The checks run, exit non-zero for a host scheduler, and emit a structured
      line. What is missing is delivery to a person, so the shop would find out about a full disk
      when it cannot take an order. An alert nobody receives is not an alert.
  - id: DEC-026
    title: Who holds the key that can read the shop's backups
    status: OPEN
    owner: BUSINESS_OWNER
    affected_capabilities: [INTERNAL_SHADOW]
    fail_closed_behavior: NOT_SUPPORTED
    source: docs/DECISION_REQUEST_BACKUP_KEY_CUSTODY_2026-09.md
    opened_at: '2026-09-03'
    question: >-
      ADR-0007 §3 requires the archive to be encrypted before it leaves the host "with a key that is
      not stored on Host A". Taken literally that excludes a passphrase, because a value present to
      write the archive also decrypts every archive ever taken -- the exact failure the requirement
      exists to exclude. So the archiving encrypts to a recipient public key and the identity that
      can read lives elsewhere. The owner decides who physically holds it, where the second copy
      lives, who may authorise its use in a restore, and acknowledges that losing it makes every
      backup permanently unrecoverable -- not difficult, impossible, with no vendor to call and no
      copy on the server by design.
    blocking_today: >-
      Archiving is built and not enabled: `archive_command`, the base-backup sidecar and the restore
      script all exist, and none can run without a recipient key. `BACKUP-RESTORE-001` completes on
      a drill result rather than on configuration, and the drill needs the identity this decision
      places. Deferring means the deployment runs with no recovery at all.
  - id: DEC-027
    title: What the first production release contains, and what it deliberately leaves out
    status: RESOLVED
    owner: BUSINESS_OWNER
    affected_capabilities: [INTERNAL_SHADOW]
    fail_closed_behavior: NOT_SUPPORTED
    source: context/tasks/TASK-shop-cutover-001.md
    opened_at: '2026-08-31'
    question: >-
      Whether the first production deployment carries the AI, or only the deterministic staff
      console. The distinction is not a preference: `delivery/GATE_REGISTRY.yaml` and the release
      gate schema require, for even the lowest AI stage, a manifest signed by three distinct actors,
      and the next stage additionally requires fourteen shadow days, one hundred representative
      interactions and thirty completed real orders. Those orders can only come from operating the
      shop, so the deterministic console is not an alternative to the AI ladder -- it is its first
      rung.
    resolved_at: '2026-08-31'
    decision_record: context/tasks/TASK-shop-cutover-001.md
    resolution: >-
      R1 is the deterministic staff console running one real shop: Zone C only, one host, no public
      ingress, no channel, no model. All thirteen capabilities read NOT_AUTHORIZED on day one, which
      is the expected production state rather than a gap, and all five feature flags ship false --
      `WorkerSettings` raises if any is true, so deploying the code cannot enable a capability.

      ADR-0007 §1 permits the shape and gives the reason: Zone P and Zone A exist to process
      untrusted language, and "if cost forces one host, the correct response is to delay public
      ingress, not to collapse the boundary." R1 has no untrusted language to process.

      Deliberately out of scope, each with the decision that keeps it out rather than an omission:
      the model provider posture (`DEC-006`), the inbound channel and who staffs it (`DEC-016`), the
      market-facing name (`DEC-017`), and retention purge execution (`DEC-018`, `DEC-019`,
      `DEC-020`) -- which R1 does not reach, because it stores no customer personal data at all: no
      address column exists in any migration, a walk-in is a counter ticket under `DEC-013`, there
      is no customer-record layer under `DEC-015`, and with no channel there are no webhook
      payloads, conversation bodies or agent drafts. The one class that accumulates is the order
      financial record, whose schedule is ten years.

      What R1 still needs from the owner is recorded as its own decisions: `DEC-024` order exit,
      `DEC-025` alert routing, `DEC-026` backup key custody, and the hosting selection tracked as
      `DECISION-HOSTING-001`.
