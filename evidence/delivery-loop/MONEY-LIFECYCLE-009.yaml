requirement_contract: Review M1, M3, M7; DEC-045, DEC-046, DEC-047 (delegated, not signed). A storage-fee
  part already paid stays owed-for; the waiver and a 0 VND payment settle; a no-charge cancellation of
  an order that earned or spent a credit voids the unspent credit, nets what was paid out and reissues
  a spent credit once; a hold pauses the fee and never erases it (holds live in order_storage_holds).
rollback_impact: Migration 0066 is additive and forward-only (hold table); older code never reads it.
  Revert the commits; the refund sheet then refuses these cancellations as before. Rolling data back is
  docs/runbooks/restore-drill.md from the base backup shop-till-mac.md section 8 takes before every upgrade.
unresolved_assumptions: The two fail-closed alternatives (refuse such cancellations; count held days)
  are the recorded reversals. A replayed cancellation must not repeat its void, net or reissue; the later
  9b slice moved the credit-chain decision under the locks.
