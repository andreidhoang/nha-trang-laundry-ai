name: nha-trang-laundry-ai

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: nha_trang_laundry
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d nha_trang_laundry"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

