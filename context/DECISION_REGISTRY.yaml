  - id: DEC-013
    title: How a walk-in customer is identified at the counter
    status: RESOLVED
    owner: BUSINESS_OWNER
    affected_capabilities: [INTERNAL_SHADOW, QUOTE_ESTIMATE]
    fail_closed_behavior: REQUIRE_HUMAN
    source: docs/DECISION_REQUEST_WALKIN_IDENTITY_2026-08.md
    opened_at: '2026-08-18'
    question: >-
      The intake screen requires a contact binding, and the only source of one is a message the
      customer already sent through a verified channel. A person who walks in off the street has
      never sent one, so they cannot be taken in through the system at all. Creating a contact at
      the counter means recording personal data with no consent record behind it, which the
      privacy posture forbids by default. The owner decides what may be stored (a name? a phone
      number? nothing at all?), for how long, and how the customer agrees to it.
    blocking_today: >-
      Walk-in customers are handled on paper. The console states this on the intake screen and in
      the unsupported-capability register rather than offering a field that would quietly create
      the record the decision has not authorized.
    resolved_at: '2026-08-26'
    decision_record: docs/DECISION_REQUEST_WALKIN_IDENTITY_2026-08.md
    resolution: >-
      Owner ratified the engineering recommendation on record — the ticket-only option — in
      Vietnamese on 2026-08-26: "Khách vãng lai được ghi nhận bằng một số phiếu do quầy phát. Hệ
      thống không lưu tên, số điện thoại hay địa chỉ của khách vãng lai. Khi nào tiệm cần nhắn tin
      cho khách, đó là một quyết định mới kèm lời đồng ý."

      No personal data is stored for a walk-in, so there is no consent question to answer, no
      retention schedule to write, and nothing that Decree 13/2023 obliges the shop over. The
      counter issues a number and the order is tracked by it.

      The reason this option rather than name-and-phone is asymmetry of reversibility, and it is
      worth recording because it is the argument that decided it. Starting with a ticket and later
      adding a name is an additive change made when consent exists. Starting with a name and later
      deciding not to hold one is not reversible: the data was already taken. Choosing the ticket
      also costs nothing today, because the only thing a phone number buys is messaging a customer
      about their order, and no channel is connected.
