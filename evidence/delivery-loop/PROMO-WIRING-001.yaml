  - command: adversarial review, four passes
    status: RECORDED
    result: >-
      This item was merged once before its verifiers finished and they then found real defects. Four
      fix passes followed, and three of the wrong turns were the lead's own. Each created an
      obligation nothing could discharge, one layer deeper: an `APPLY_PROMOTION` envelope no route
      accepts; a sale refused after the one-shot credit was already burnt; a bill that rose 25.000 ₫
      because a customer spent a credit. The common cause was resolving a question the engine had
      already correctly refused to resolve. `PROMOTION_STACKING_REQUIRES_HUMAN` was never a gap to
      fill. The final pass stops deciding and asks the owner.
