openapi: 3.1.0
info:
  title: Nha Trang Laundry internal API
  version: v1
  description: 'Generated from the built FastAPI application by scripts/generate_internal_api_contract.py.
    It covers EVERY served operation, including those FastAPI excludes from its own schema via include_in_schema=False
    - on this application that is four operations, three of them the authentication surface. Do not hand-edit:
    scripts/verify_contracts.py regenerates this document and fails on any difference, which is what keeps
    a new route from landing without a contract entry. Non-operation entries the application serves -
    today only the /staff static mount - are listed under x-served-mounts rather than omitted; an unrecognized
    route type is a hard generation failure, not a silent skip.'
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Return only process health; dependency health is added with real infrastructure.
      x-authorization-dependencies: []
      x-documented-by-fastapi: false
      responses:
        '200':
          description: Success response.
  /internal/v1/approvals:
    get:
      operationId: list_pending_approvals
      summary: list_pending_approvals
      x-authorization-dependencies:
      - require_approval_staff
      - get_operations_service
      x-documented-by-fastapi: true
      responses:
        '200':
          description: Success response.
    post:
      operationId: request_approval
      summary: request_approval
      x-authorization-dependencies:
      - require_operations_staff
      - get_operations_service
      x-documented-by-fastapi: true
      responses:
        '201':
          description: Success response.
