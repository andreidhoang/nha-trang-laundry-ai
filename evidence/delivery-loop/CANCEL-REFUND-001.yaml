schema_version: 1
work_item: CANCEL-REFUND-001
recorded_at: '2026-09-24T21:00:00+07:00'
requirement_contract: 'A paid order cancelled under a resolution DEC-024 says is not charged kept its
  settlement and read PAID, so ''tien da thu hom nay'' (DEC-014) exceeded the drawer. Found independently
  by two reviewers. Required: refund recorded atomically and equal to the settlement; takings net of refunds
  per business day; invariant 2 kept.'
rollback_impact: Migration 0046 only adds (a table, constraints, triggers). With it applied and code reverted,
  the old code cannot cancel a paid order -- the trigger refuses -- which fails safe. Migrations are forward-only;
  a code revert past 0046/0047 leaves them applied, which is safe as stated per item. Rolling the data
  back is docs/runbooks/restore-drill.md from the base backup shop-till-mac.md section 8 now takes before
  every upgrade.
unresolved_assumptions: DEC-024's instruction that SHOP_FAULT_NO_CHARGE opens a DEC-004 incident is not
  automated. No backfill of paid orders cancelled before 0046. Whether a refunded item keeps a damage
  ceiling is an owner question.
evidence:
  the_refund_equals_the_settlement_by_schema: A composite FK to order_settlements (id, order_id, store_id,
    paid_amount_vnd) makes a differing refund unrepresentable; a trigger refuses REFUNDED without a refund
    row and a refund without its cancellation.
  takings_are_non_negative_and_net_of_refunds: 'collected_vnd keeps its v1 meaning (gross); refunded_vnd
    gross; net_vnd with net_direction IN/OUT; the response model declares ge=0. Refund-only day: (0, 110000,
    110000, OUT). Live: a paid order cancelled SHOP_FAULT_NO_CHARGE moved collected 876000->1016000, refunded
    0->140000, net unchanged, balance REFUNDED.'
  refund_mutation_event_audit_outbox_are_atomic: test_the_refund_the_transition_and_its_ledger_rows_commit_together
    and test_the_cancellation_event_audit_and_outbox_name_the_refund.
  no_late_credit_on_a_refunded_bill: 'Exists only with both money branches merged: test_a_late_delivery_credit_on_a_fully_refunded_order_is_refused
    failed on the merged tree (DID NOT RAISE) and passes after 84c9648.'
  rollback_assessment: Migration 0046 only adds (a table, constraints, triggers). With it applied and
    code reverted, the old code cannot cancel a paid order -- the trigger refuses -- which fails safe.
    Migrations are forward-only; a code revert past 0046/0047 leaves them applied, which is safe as stated
    per item. Rolling the data back is docs/runbooks/restore-drill.md from the base backup shop-till-mac.md
    section 8 now takes before every upgrade.
