    title: Weight precision and rounding policy
    status: RESOLVED
    owner: BUSINESS_OWNER
    affected_capabilities: [QUOTE_ESTIMATE, BOOKING]
    fail_closed_behavior: REQUIRE_HUMAN
    source: specs/TEAM_REVIEW_REPORT_V1.md
    resolved_at: '2026-08-18'
    decision_record: docs/DECISION_REQUEST_PRICING_POLICY_2026-08.md
    resolution: >-
      Owner ratified the engineering recommendation on record (Decision A of the linked packet):
      no rounding — bill the exact scale reading, matching the already-confirmed worked examples
      (5.9kg = 147,500đ, 6.1kg = 122,000đ). Scale precision is assumed 0.1kg in the packet and has
      not been separately confirmed by the owner; input validation should be revisited if that
      assumption is wrong.
