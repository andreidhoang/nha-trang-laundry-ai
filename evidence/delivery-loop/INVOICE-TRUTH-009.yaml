requirement_contract: Review M5, M6. A monthly account invoice lists what each order cost (owed, so a
  deposit taken before the order went on account is not lost); an issued invoice request is fixed at the
  figure it was issued at (migrations 0068, 0071), later movement (storage fee, refunds) is shown beside
  it and never rewrites it; legacy double cover is flagged and a range quote cannot be issued.
rollback_impact: Migrations 0068 and 0071 are additive and forward-only; the 0068 backfill reads cancelled/refunded
  as of the issue (842c9e8). Hide the screen; requests stay on record. Rolling data back is docs/runbooks/restore-drill.md
  from the base backup shop-till-mac.md section 8 takes before every upgrade.
unresolved_assumptions: Invoice type, rate and date remain the owner's and the accountant's; the software
  issues nothing and names no tax.
