requirement_contract: 'Places a shift got stuck, reproduced with Playwright by the console reviewer: ''Khach
  da chot gia'' erased itself on failure; a second reprice was refused as stale; server refusals reached
  staff in English; ''5,5'' was refused as a missing fact; a mistyped payment was told not to retype and
  DEC-010 was called open; the export flow''s own instructions discarded its progress.'
rollback_impact: Client code, registry and manifest only; git revert restores them together. Migrations
  are forward-only; a code revert past 0046/0047 leaves them applied, which is safe as stated per item.
  Rolling the data back is docs/runbooks/restore-drill.md from the base backup shop-till-mac.md section
  8 now takes before every upgrade.
unresolved_assumptions: 'The in-progress export is kept in page memory, not sessionStorage, because test_the_client_persists_nothing_but_a_store_identifier
  forbids it; a reload loses it and the screen says so. The damage picker still shows line ids: the server
  sends no service per line yet.'
evidence:
  a_failed_acceptance_keeps_its_control_and_says_why: 'p1_accept_matrix, eight failure shapes (409 expired
    / accepted / moved, 422, 500, 504, 503, network abort): control and hint survive, Vietnamese title,
    a way forward; for 500/504/network a second press reuses the Idempotency-Key and the server replays.
    Before: no notice ever shown.'
  a_second_reprice_is_not_refused_as_stale: 'p2_reprice_cas against a stub enforcing the server''s revision
    checks: five writes accepted, banner r1->r5. Before: dead end on the second press.'
  server_refusals_reach_staff_in_vietnamese_naming_the_recorded_fact: 29 REFUSAL entries copied from real
    raise sites. The real-API conformance run on the merged tree caught that the cancellation contradictions
    fell back to the generic title and hid the fact on record; ca395c2 adds them, and the run now asserts
    the Vietnamese sentence names 'da ghi nhan tiem nhan do'.
  no_client_side_money_arithmetic: The takings drawer line picks a word from net_direction; the payment
    panel shows the server's payable_total_vnd; parseDong and parseQuantity refuse rather than compute.
  rollback_assessment: Client code, registry and manifest only; git revert restores them together. Migrations
    are forward-only; a code revert past 0046/0047 leaves them applied, which is safe as stated per item.
    Rolling the data back is docs/runbooks/restore-drill.md from the base backup shop-till-mac.md section
    8 now takes before every upgrade.
