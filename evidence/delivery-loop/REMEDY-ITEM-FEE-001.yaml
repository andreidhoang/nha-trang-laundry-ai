recorded_at: '2026-09-25T15:00:00+07:00'
requirement_contract: 'DEC-031, plus two follow-on rulings: per-piece services cap on the recorded unit
  price; weight-priced on the bag; every loss and every compensation on a refunded order goes to the owner;
  a line of N pieces carries 5 x item fee x N with each claim capped at one item; a credit reserved before
  a non-stacking promotion is released rather than withholding the promotion (DEC-030).'
rollback_impact: Each rule is in packages/domain remedies.py with its own test; 0051 replaces two CHECK
  constraints from 0042 and adds one, and Postgres refuses to reinstate the old ones while a DEC-031 loss
  row exists, which is correct. Migrations 0048-0051 are forward-only and additive; rolling data back
  is docs/runbooks/restore-drill.md from the base backup shop-till-mac.md section 8 takes before every
  upgrade.
unresolved_assumptions: The fee is min(recorded unit price, line net). A single piece with no recorded
  unit price uses the line; several pieces with none go to the owner. Owner envelopes expire in ten minutes,
  and every loss now needs one. Per-piece identity does not exist, so the ceiling is aggregated per line
  rather than tracked per shirt.
