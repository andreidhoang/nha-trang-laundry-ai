schema_version: 1
work_item: CREDIT-RESERVATION-001
recorded_at: '2026-09-24T21:00:00+07:00'
requirement_contract: 'A redeemed remedy credit was spent when the credited revision was written, so a
  reprice, an expiry or an abandoned quote lost money the shop owes under DEC-004. Required: reserved
  by a quote, spent by the order that uses it, never partially.'
rollback_impact: No migration; redeemed_* is still written exactly once, now at order creation. A code
  revert restores spend-at-redemption. Migrations are forward-only; a code revert past 0046/0047 leaves
  them applied, which is safe as stated per item. Rolling the data back is docs/runbooks/restore-drill.md
  from the base backup shop-till-mac.md section 8 now takes before every upgrade.
unresolved_assumptions: 'Deviation from the lead''s brief, accepted: a credit larger than the new bill
  is released whole rather than capped, because a capped credit would be spent with the remainder lost
  -- the defect itself. Acceptance does not pre-check that a carried credit is still unspent; the refusal
  comes at order creation.'
evidence:
  a_credit_is_spent_only_by_the_order_that_uses_it: 'test_remedy_credit_lifecycle.py through the real
    OperationsService: 5 failed before, all pass after; skipping the spend at order creation fails 4 of
    them.'
  a_reprice_carries_or_releases_never_partially_spends: 'test_remedy_credit_carry.py: 10 tests including
    the reviewer''s repro (now 95.000 d) and the 6 kg cliff held exactly under a carried credit; hypothesis
    property (200 examples): full face value or released, never partial, never above the bill. A revision
    that silently drops a reserved credit is refused (REMEDY_CREDIT_DROPPED).'
  a_credit_can_be_spent_once: Double conversion refused; the same credit twice on one quote refused (REMEDY_CREDIT_ALREADY_ON_QUOTE).
  rollback_assessment: No migration; redeemed_* is still written exactly once, now at order creation.
    A code revert restores spend-at-redemption. Migrations are forward-only; a code revert past 0046/0047
    leaves them applied, which is safe as stated per item. Rolling the data back is docs/runbooks/restore-drill.md
    from the base backup shop-till-mac.md section 8 now takes before every upgrade.
