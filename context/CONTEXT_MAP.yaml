schema_version: 1
purpose: Deterministic context assembly for engineering and agent work.
authoritative_order:
  - owner_published_configuration
  - postgres_immutable_snapshot
  - machine_readable_contract
  - approved_specification
  - build_engineering_specification
  - research_or_template
global_sources:
  - path: BUILD_ENGINEERING_SPEC.md
    purpose: English execution contract
  - path: AGENTS.md
    purpose: durable Codex repository guidance
  - path: context/CONTINUATION_PROTOCOL.md
    purpose: deterministic resume, completion, blocker, and handoff protocol
  - path: context/PROJECT_CONTINUATION.md
    purpose: reconciled implementation state, safe next slices, and production handoff
  - path: specs/README.md
    purpose: specification hierarchy
  - path: specs/TEAM_REVIEW_REPORT_V1.md
    purpose: go/no-go and P0 evidence requirements
  - path: delivery/PROGRAM_PLAN.yaml
    purpose: stable implementation phases and dependency order
  - path: delivery/GATE_REGISTRY.yaml
    purpose: canonical cumulative release-gate and capability mapping
domains:
  platform:
    sources:
      - specs/IMPLEMENTATION_ROADMAP_V1.md
      - docs/adr/0001-python-control-plane.md
      - docs/adr/0007-production-deployment-topology.md
      - delivery/PROGRAM_PLAN.yaml
      - docs/runbooks/local-development.md
      - docs/runbooks/container-deployment.md
      - docs/runbooks/private-staging.md
      - specs/PRODUCTION_OPERATIONS_SPEC_V1.md
    contracts: []
    prohibitions:
      - Do not introduce public channels or external automation in M0-M3.
      - The public agent runtime cell runs on a separate host and may reach only the approved model endpoint and Tool Facade.
      - Production feature flags ship closed; deploying code never enables a capability.
  runtime_architecture:
    sources:
      - specs/AGENT_SYSTEM_AND_EVAL_SPEC_V1.md
      - specs/SECURITY_RELIABILITY_SPEC_V1.md
      - specs/IMPLEMENTATION_ROADMAP_V1.md
      - docs/PROJECT_ENGINEERING_FIRST_PRINCIPLES_VI.md
      - docs/adr/0002-production-agent-runtime-and-trust-boundaries.md
      - docs/adr/0003-provider-neutral-agent-runtime-and-channel-operations.md
      - docs/adr/0004-runtime-consolidation-and-frozen-openclaw-evidence.md
      - delivery/PROGRAM_PLAN.yaml
    contracts:
      - specs/contracts/agent-tools-v1.openapi.yaml
      - specs/contracts/release-gate-manifest-v1.schema.json
      - specs/contracts/capability-status-v1.schema.json
      - specs/contracts/provider-data-evidence-v1.schema.json
      - specs/contracts/container-scan-evidence-v1.schema.json
      - specs/contracts/supply-chain-evidence-v1.schema.json
      - specs/contracts/openclaw-repackage-manifest-v1.schema.json
      - specs/contracts/openclaw-repackage-manifest-v2.schema.json
      - specs/contracts/openclaw-cross-platform-result-v1.schema.json
      - delivery/GATE_REGISTRY.yaml
    prohibitions:
      - Every public agent runtime is a reasoning client, never the business or security authority.
      - Pin the evaluated model and explicit runtime implementation/route; never authorize a moving alias.
      - Real-customer model use is disabled until provider storage and retention behavior is verified.
      - OpenClaw remains EVAL_ONLY until custom-runtime parity and retirement evidence pass.
      - The custom adapter remains a bounded finite state machine; do not build a generic agent framework.
      - Runtime comparisons use identical model, prompt, context, tools, budgets, datasets and safety denominator.
  pricing:
    sources:
      - specs/DOMAIN_DATA_API_SPEC_V1.md
      - specs/ENGINEERING_SPEC_V1.md
      - PRICEBOOK_V1.md
      - templates/services-pricebook.csv
    contracts:
      - specs/contracts/canonical-enums-v1.json
      - specs/contracts/pricebook-import-manifest-v1.json
    prohibitions:
      - The model must not calculate, select, or modify money.
      - Use integer VND only.
  promotion_delivery_sla:
    sources:
      - specs/DOMAIN_DATA_API_SPEC_V1.md
      - specs/ENGINEERING_SPEC_V1.md
      - PROMOTION_2026_08.md
      - DELIVERY_POLICY_DRAFT.md
      - SERVICE_CATALOG_AND_SLA_V1.md
    contracts:
      - specs/contracts/canonical-enums-v1.json
    prohibitions:
      - Unresolved or stale policy must return REQUIRE_HUMAN.
  orders_audit:
    sources:
      - specs/DOMAIN_DATA_API_SPEC_V1.md
      - specs/SECURITY_RELIABILITY_SPEC_V1.md
    contracts:
      - specs/contracts/canonical-enums-v1.json
    prohibitions:
      - All material mutation, event, audit, and required outbox records commit atomically.
  agent_tools:
    sources:
      - specs/AGENT_SYSTEM_AND_EVAL_SPEC_V1.md
      - specs/SECURITY_RELIABILITY_SPEC_V1.md
    contracts:
      - specs/contracts/agent-tools-v1.openapi.yaml
      - specs/contracts/release-gate-manifest-v1.schema.json
      - specs/evals/eval-manifest-v1.yaml
    prohibitions:
      - Do not add a generic tool, raw database access, shell, browser, or direct-send capability.
      - The public agent cannot choose customer, contact, address, or order identifiers.
  privacy_consent:
    sources:
      - specs/ENGINEERING_SPEC_V1.md
      - specs/SECURITY_RELIABILITY_SPEC_V1.md
      - CUSTOMER_SERVICE_POLICY_DRAFT.md
    contracts:
      - specs/contracts/canonical-enums-v1.json
    prohibitions:
      - STOP and suppression are deterministic ingress and egress checks.
      - Never add internal risk material to customer retrieval content.
  channel_operations:
    sources:
      - specs/ENGINEERING_SPEC_V1.md
      - specs/SECURITY_RELIABILITY_SPEC_V1.md
      - specs/AGENT_SYSTEM_AND_EVAL_SPEC_V1.md
      - specs/IMPLEMENTATION_ROADMAP_V1.md
      - docs/PROJECT_ENGINEERING_FIRST_PRINCIPLES_VI.md
      - docs/adr/0003-provider-neutral-agent-runtime-and-channel-operations.md
      - docs/adr/0005-official-channel-selection-zalo-oa.md
      - docs/adr/0007-production-deployment-topology.md
      - specs/CHANNEL_ADAPTER_SPEC_V1.md
      - specs/PUBLIC_CUSTOMER_POLICY_SPEC_V1.md
    contracts:
      - specs/contracts/canonical-enums-v1.json
      - specs/contracts/channel-inbound-envelope-v1.schema.json
      - specs/contracts/channel-outbound-receipt-v1.schema.json
      - specs/contracts/public-policy-bundle-v1.schema.json
    prohibitions:
      - Channel adapters persist and deduplicate before any model call.
      - Public agent runtimes never receive channel credentials or direct-send capability.
      - Zalo Personal automation is prohibited; only official Zalo OA may be evaluated.
      - Telegram is an engineering sandbox only and never counts toward any gate evidence minimum.
      - An unknown send outcome is never retried automatically; only provider confirmation or a human may resolve it.
      - Dashboard metrics and priorities are deterministic; AI may explain but not originate or mutate them.
  business_truth:
    sources:
      - BUSINESS_TRUTH_INTAKE.md
      - MACHINE_INVENTORY.md
      - PRICEBOOK_V1.md
      - PROMOTION_2026_08.md
      - SERVICE_CATALOG_AND_SLA_V1.md
      - templates/business-profile.csv
      - templates/delivery-cost-log.csv
      - templates/machine-master.csv
    contracts:
      - specs/contracts/pricebook-import-manifest-v1.json
    prohibitions:
      - Fields marked CẦN ĐO or CẦN CHỐT are unmeasured; never let an agent commit to them.
      - Owner-confirmed values are business truth; observed document values are evidence, not configuration.
      - POLICY_RISK_REVIEW.md is internal risk material and never enters a customer-facing corpus.
  evaluation_release:
    sources:
      - specs/AGENT_SYSTEM_AND_EVAL_SPEC_V1.md
      - specs/TEAM_REVIEW_REPORT_V1.md
      - docs/adr/0004-runtime-consolidation-and-frozen-openclaw-evidence.md
      - docs/adr/0006-two-party-release-authorization.md
      - delivery/GATE_REGISTRY.yaml
    contracts:
      - specs/evals/eval-manifest-v1.yaml
      - specs/contracts/release-gate-manifest-v1.schema.json
      - specs/contracts/release-gate-manifest-v2.schema.json
      - specs/contracts/capability-status-v1.schema.json
      - specs/contracts/trusted-release-signers-v1.schema.json
      - specs/contracts/provider-data-evidence-v1.schema.json
      - specs/contracts/container-scan-evidence-v1.schema.json
      - specs/contracts/supply-chain-evidence-v1.schema.json
      - specs/contracts/openclaw-repackage-manifest-v1.schema.json
      - specs/contracts/openclaw-repackage-manifest-v2.schema.json
      - specs/contracts/openclaw-cross-platform-result-v1.schema.json
    prohibitions:
      - No release is authorized without a valid, signed, unexpired evidence manifest.
