requirement_contract: >-
  context/tasks/TASK-runtime-freeze-001.md and docs/adr/0004-runtime-consolidation-and-frozen-openclaw-evidence.md
  require ADR-0004 to be applied to the machine-readable delivery state only: record the freeze in the
  blocking_condition of AGENT-001, OPENCLAW-REPACK-001 and RUNTIME-SECURITY-001 while their status stays
  BLOCKED; add AGENT-002 as the G1_INTERNAL_SHADOW_READY agent-evidence carrier with no inherited
