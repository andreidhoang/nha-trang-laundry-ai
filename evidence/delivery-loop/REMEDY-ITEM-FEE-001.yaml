    (500-example property); red on 96f2036's base, green after; 14/14 mutants killed (M8 needed a reverse-order
    test, added).
  every_loss_claim_needs_the_owner: 'Live walk-through against the running API on 2026-09-25, as the real
    roles (demo-operations, demo-owner, demo-auditor): a 50.000 d loss on ticket 5, under the 100.000
    d staff limit, returned OWNER_APPROVAL_REQUIRED with owner_reasons [LOSS_CLAIM]. Schema constraint
    remedy_proposals_loss_needs_the_owner refuses a staff-authorised loss row.'
  compensation_on_a_refunded_order_needs_the_owner: test_compensation_on_a_refunded_order_needs_the_owner
    (damage and loss) and the payment-time re-check test; the late-delivery credit on a refunded bill
