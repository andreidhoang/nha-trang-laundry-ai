name: quality

on:
  pull_request:
  push:
    branches: [main]
  # Manual trigger, so the gate can be proved to work without inventing a pull request to test it.
  #
  # Added because an audit on 2026-09-17 found this workflow had run **zero times since it was
  # registered on 2026-08-12**, across every pull request and every push to main in that window.
  # The workflow was never the problem -- the API reports it `active` -- so Actions itself was off
  # above it, and nothing in the repository said so. A `pull_request` status of "pending" with no
  # checks reads identically to "CI is still running", which is how five weeks passed.
  #
  # With this, `Actions → quality → Run workflow` answers "is the gate on?" in one click, on any
  # branch, without opening a throwaway pull request to find out.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci_app:ci-only-password@127.0.0.1:5432/nha_trang_laundry_ci"
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: nha_trang_laundry_ci
          POSTGRES_USER: ci_app
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_app -d nha_trang_laundry_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: runtime/openclaw/public-cell/plugin/package-lock.json
      - run: uv sync --all-packages --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy apps packages
      - run: uv run python scripts/apply_migrations.py
      - run: uv run pytest --require-postgres-integration
      - run: uv run python scripts/verify_contracts.py
      - run: uv run python scripts/check_context_drift.py
      - run: uv run python scripts/report_delivery_status.py
      - run: npm ci
        working-directory: runtime/openclaw/public-cell/plugin
      - run: npm run build
        working-directory: runtime/openclaw/public-cell/plugin
      - run: npm test
        working-directory: runtime/openclaw/public-cell/plugin
