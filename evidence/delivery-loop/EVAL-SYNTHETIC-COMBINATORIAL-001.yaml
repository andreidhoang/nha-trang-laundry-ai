requirement_contract: >-
  context/tasks/TASK-eval-synthetic-combinatorial-001.md and specs/evals/eval-manifest-v1.yaml
  require the synthetic combinatorial suite to reach synthetic_combinatorial_suite.minimum_cases of
  500 with maximum_wrong_monetary_values of 0, generated by calling the deterministic domain engines
  rather than by authoring expected values, frozen under a content hash, covering every declared
  boundary at, below and above, carrying no personal identifier, and with
  actual_dataset_inventory.SYNTHETIC_COMBINATORIAL updated to the true count. The corpus itself was
  built in an earlier pass; the one declared evidence entry that could not be satisfied truthfully
  was manifest_inventory_updated, and that is what this slice closes.
rollback_impact: >-
  Two files carry the change: one line of specs/evals/eval-manifest-v1.yaml
  (SYNTHETIC_COMBINATORIAL 0 to 669) and the re-derived current bundle
  evidence/agent-shadow/local-synthetic-suite-v2.json. Rollback is reverting the manifest line and
  re-running scripts/capture_local_agent_evidence.py, which restores the prior pin because the
  bundle is derived from the tree rather than edited. evidence/agent-shadow/local-synthetic-suite-v1.json
  is unchanged and was never opened for writing, confirmed by an empty git diff and by
  test_superseded_bundle_is_retained_byte_for_byte. No migration, no database content, no provider
  credential, no network call, no deployment and no capability authorization is involved. The
  remaining changes are comment-only.
unresolved_assumptions: >-
  This item was BLOCKED and was unblocked in this session on a verified changed condition, not on an
  argument. EVIDENCE-REPIN-001 is COMPLETE and is a depends_on of this item; the owner chose option 1
  of context/tasks/TASK-evidence-repin-001.md on 2026-08-13, which establishes that a pinned file
  changes by re-deriving the current bundle while the superseded one is retained byte-for-byte. This
  item's own blocking_condition already recorded the lift and ended "Reverting the change was the
  correct call at the time; it no longer is." The unblock reason quotes that text and the fresh
  generation digest was taken immediately before the call.

  What this does NOT do, stated because the number invites the opposite reading. It removes no
  release blocker. REQUIRED_DATASET_MINIMA_NOT_MET remains in release_blockers because four of the
  five gated suites are still at zero: frozen regression 0/200, adversarial 0/200, normal language
  0/300, public corpus 0/100. The corpus total moves from 0 to 669 of 1,300 and one of five minima is
  now met. No gate state changes, no capability changes; all 13 remain NOT_AUTHORIZED, verified after
  the change. The other three corpus items that the same conflict blocked identically were
  deliberately left alone - one item per slice.

  A residual note for the next reader. scripts/capture_local_agent_evidence.py pins itself in
  PINNED_ARTIFACTS, so the bundle attests the script that produced it. That is intentional and it
  means the script must never be modified in the same breath as a re-derivation without saying so.
  It was not modified here. Re-deriving also required exporting PYTHONPATH from
  scripts/workspace_env.py because the script spawns a subprocess that does not inherit the
  workspace roots under the .pth defect described in CLAUDE.md; that is an environment workaround,
  not a code change, and the script's bytes are untouched.

  Verification honesty: the adversarial pass was performed inline in the implementing session rather
  than by a separate reviewer in a fresh context. That is the weaker form. Six attacks were tried and
  all failed: a cleared release blocker (no - the list is unchanged and verify_contracts still
  reports 10), an untruthful count (no - verify_contracts re-prices all 669 and raises unless the
  declared number is 0 or exactly the corpus length), a fabricated attestation (no - the bundle was
  re-derived by the sanctioned script and the diff shows only the manifest hash and captured_at), a
  mutated superseded bundle (no - empty git diff), a relabelled SKIP (no - the result object is
  byte-identical), and a moved gate (no - 13 capabilities NOT_AUTHORIZED, authorization files
  untouched).
evidence:
  synthetic_combinatorial_minimum_cases: >-
    669 cases against a declared minimum of 500 in specs/evals/eval-manifest-v1.yaml
    release_policy.synthetic_combinatorial_suite. verify_contracts.py reports "Validated 669
    synthetic combinatorial cases against the domain engines" on every run, and
    test_the_corpus_meets_the_declared_minimum asserts the floor. This satisfies one of five suite
    minima; the other four remain at zero and the aggregate is 669 of 1,300.
  expected_values_from_deterministic_domain_only: >-
    Every expected monetary value is recomputed by calling the deterministic pricing engine on each
    verify_contracts.py run rather than being compared against a stored literal, so a domain change
    that moves a value surfaces as a failure rather than as a silently stale fixture.
    test_every_expected_value_is_reproduced_by_the_domain_engines asserts it, and
    test_a_corrupted_expected_value_is_detected proves the check is live by perturbing one amount by
    a single dong and requiring detection. test_generation_is_deterministic proves the generator is
    reproducible.
  boundary_coverage_proof: >-
    test_every_declared_boundary_is_covered_at_below_and_above requires each declared boundary to
    appear at, below and above its threshold. test_the_six_kilogram_cliff_is_preserved_rather_than
    _smoothed asserts the confirmed business rule that exactly 6 kg already takes the lower
    per-kilogram rate - the cliff that makes 5.9 kg cost more than 6.0 kg. A generator that smoothed
    it would be wrong even with every case passing, so this is a correctness test and not a coverage
    statistic. test_splitting_one_quantity_across_lines_prices_identically and
    test_a_range_priced_service_never_claims_an_exact_amount cover the two adjacent traps.
  zero_wrong_monetary_values: >-
    wrong_monetary_value_count over the frozen document is asserted equal to 0, matching the
    manifest's maximum_wrong_monetary_values of 0 for the deterministic domain suite. The count is
    derived by re-pricing, not by trusting the stored expectation.
  no_raw_pii_fixture: >-
    test_no_case_carries_a_personal_identifier asserts that no case carries a personal identifier.
    The corpus is generated from the domain input space - service codes, weight bands, promotion
    windows, distances, SLA states - and contains no mined utterance and no customer record. Mined
    human language is EVAL-LANGUAGE-CORPUS-001 and is gated separately by CORPUS-CONSENT-001.
  manifest_inventory_updated: >-
    actual_dataset_inventory.SYNTHETIC_COMBINATORIAL now reads 669, published in this slice as a
    single-line change to specs/evals/eval-manifest-v1.yaml. Because that file is one of the 21
    artifacts pinned by the current local evidence bundle, the change landed together with a
    re-derivation of evidence/agent-shadow/local-synthetic-suite-v2.json by
    scripts/capture_local_agent_evidence.py - the procedure EVIDENCE-REPIN-001 established and the
    owner authorized on 2026-08-13. The bundle was not hand-edited; a diff against its previous
    content shows exactly two changed fields, the manifest hash and captured_at, with every case
    status, the release-blocker list, release_effect NONE and primary_provider_evidence false
    unchanged. verify_contracts.py enforces that the declared number is either 0 or exactly the
    corpus length, so 669 cannot be an aspiration.
  rollback_assessment: >-
    One manifest line and one derived bundle, both reversible by reverting the line and re-running
    the capture script. The superseded v1 bundle is untouched. The comment reconciliations in
    packages/evals/tests/test_synthetic_combinatorial.py and scripts/verify_contracts.py removed
    statements that publishing is blocked, which stopped being true when EVIDENCE-REPIN-001
    completed; no assertion, raise or branch was added, removed or altered, verified by diff. No
    schema, database, credential, network, deployment or capability state is involved.
