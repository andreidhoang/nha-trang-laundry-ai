evidence:
  windows_workspace_shim_pin: Native Windows tests now create and resolve the lockfile-installed openclaw.cmd shim. The verifier continues to derive the platform suffix itself and does not use PATH resolution for OpenClaw.
  deterministic_artifact_line_endings: Git declares LF for text artifacts and CRLF only for Windows command shims; Ruff is pinned to LF output. git check-attr and the Windows regression test prove the hash-bound Python, YAML, and JSON5 artifacts resolve to eol=lf.
  global_path_fallback_rejection: The regression test places an otherwise valid openclaw.cmd in PATH, verifies that resolution fails while the workspace shim is absent, and succeeds only after the workspace node_modules/.bin shim exists.
  postgres_integration_suite: A disposable PostgreSQL 16.10 container with no persistent volume applied forward migrations 0001 through 0019. The guarded suite passed all 512 tests with no skips; the affected runtime, evidence, context, and delivery set passed 47 tests natively on Windows.
  rollback_assessment: The change affects repository checkout/format policy, tests, and sanitized non-release evidence only. A source revert requires no data or external-state rollback and leaves every capability NOT_AUTHORIZED.
