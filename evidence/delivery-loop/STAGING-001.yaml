work_item: STAGING-001
recorded_at: '2026-08-02T09:31:21.5912369Z'
requirement_contract: context/tasks/TASK-staging-001.md
rollback_impact: Application rollback replaces only reviewed API and worker image digests after verifying compatibility with every forward migration. It never reverses a migration, deletes/restores PostgreSQL state, changes TLS routing, or enables a capability. If compatibility or the post-rollback TLS smoke is not proven, API and worker remain stopped and a human recovery decision is required. The custom TLS image removes Caddy's file capability at build time so runtime cap-drop and no-new-privileges must not be weakened during rollback.
unresolved_assumptions: A real Linux staging host must provide an internal Docker network connected only to a private managed PostgreSQL endpoint/proxy; separate least-privilege migration, API, and worker database roles; ten external secret references; a private CA certificate for staging.internal; private operator DNS/VPN/IAP; and reviewed immutable API, worker, and TLS image references. Docker Desktop does not expose a published port from an internal network, so the local live drill ran its TLS-verifying client inside that network. This is staging engineering evidence, not production deployment evidence or release authority. Public OpenClaw, customer ingress, provider/channel credentials, automatic sends, and every capability remain absent or NOT_AUTHORIZED.
full_repository_verification: uv run pytest --require-postgres-integration passed 499 tests; Ruff check and format, mypy, verify_contracts, context drift, and git diff checks passed. verify_contracts preserved all 9 public-runtime release blockers.
evidence:
  tls_and_private_network_topology: The plain-YAML production overlay renders only api, worker, one-shot migrate, and TLS services by default. API/worker publish no ports. Caddy terminates TLS for staging.internal on container port 8443 with a loopback-only 127.0.0.1 host binding, removes its Server header, emits HSTS, disables its admin endpoint, and routes only to the API. Its pinned custom image removes the upstream file capability instead of weakening cap-drop or no-new-privileges. ingress-private is internal; database-private is an externally pre-provisioned private network. Public OpenClaw, agent tools, customer ingress, channel adapters, and provider routes are absent.
  external_secret_contract: Database and OIDC settings load from /run/secrets only when the directory exists. The rendered API and worker environments contain no DATABASE_URL, including when the host process has one, preventing host-environment inheritance from overriding secret files. Migration, API, and worker use three distinct external database URL secrets; OIDC uses five external references; TLS certificate and private key use two external references. No values, channel credentials, model credentials, or secret fixtures are committed. The bounded migration entrypoint accepts only a regular /run/secrets/database_url file of at most 4096 bytes and never prints it.
  least_privilege_runtime: API, worker, migration, and TLS run as distinct numeric identities 10001 through 10004 with read-only roots, all Linux capabilities dropped, no-new-privileges, bounded PIDs, bounded noexec/nosuid temporary filesystems, and no Docker socket, host networking, owner workspace, OpenClaw state, or evidence mount. Migration is a restart-never job and must succeed before API/worker start. The runbook requires the only DDL-capable database identity to be the migration role; API and worker roles are separately scoped and may not be superuser, database owner, role administrator, or replication identities. All public, agent-runtime, automated-send, internal-outbox, and agent-queue flags remain explicitly false.
  deployment_and_rollback_smoke: A fresh synthetic compose deployment built the pinned API, worker, and custom TLS images, applied all 19 forward migrations, and reached healthy API/worker/TLS states on internal networks. The TLS-verifying bounded client checked hostname/CA validation, health, staff shell, fail-closed unauthenticated session with no-store, HSTS/CSP/browser headers, and 404 results for OpenClaw, webhook, and public message routes. A July 31 snapshot started against the additive schema but failed the current header smoke and was rejected. A compatible captured image snapshot then passed API/worker health and the full TLS smoke without migration reversal; current images were restored and passed again. All synthetic containers, networks, volume, secret/CA files, and drill-only tags were verified and removed; existing candidate images were preserved.
  rollback_assessment: The procedure records preceding immutable image digests, checks forward-schema compatibility, redeploys API/worker only with no dependency/migration rerun, repeats the exact TLS smoke, and fails closed by stopping services if it fails. TLS and capability flags remain unchanged. Database rollback, destructive state changes, public exposure, and bypassing private TLS are explicitly prohibited. A real staging deploy still requires external infrastructure and owner/operator coordination and is not claimed here.
