# PostgreSQL configuration for the self-managed branch of the R1 topology.
#
# Only the settings that carry a decision are here; everything else is the image's default, because
# a configuration file that restates defaults hides the lines that matter.

listen_addresses = '*'          # reachable only on the internal compose network; no host port

# --- Recovery -------------------------------------------------------------------------------
wal_level = replica
archive_mode = on
archive_command = '/usr/local/bin/archive-wal.sh %p %f'

# The single most important line for the recovery point, and the least obvious.
#
# Without it, a shop with no orders between 14:00 and 18:00 archives nothing in that window: WAL is
# only shipped when a segment fills. Every check reads healthy and the recovery point is four hours
# old. `deploy/backup/backup-policy-v1.json` allows up to 300s between segments and sets the
# recovery point at 900s; 60s leaves room for a slow upload and costs a handful of near-empty 16MB
# segments a day, which is nothing next to being four hours behind without knowing it.
archive_timeout = 60s

max_wal_size = 2GB
checkpoint_timeout = 5min
full_page_writes = on           # a torn page after a host failure is an unrecoverable backup

# --- Logging --------------------------------------------------------------------------------
# `PRODUCTION_OPERATIONS_SPEC_V1` §4 forbids customer phone numbers, addresses and message bodies
# from ever appearing in a log. Statement logging would emit bound parameter values, which is
# exactly that. The application's own structured events carry the diagnostic load instead.
log_statement = none
log_min_duration_statement = -1
logging_collector = off         # stderr to the container log, one stream for the host to collect
log_min_messages = warning
log_checkpoints = on            # a checkpoint storm is the first sign of the disk filling
