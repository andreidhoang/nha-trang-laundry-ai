name: nha-trang-laundry-private-staging

# Bounded json-file logs for every service (`OPS-HARDENING-002`); see compose.yaml for the figures.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# `OPS-OBSERVABILITY-009`. The API's log is also the source `check_shop_operations.py --check app`
# reads, and the only record of what the application did, so it keeps fourteen busy days. A busy
# day, as json-file stores it (`test_ops_hardening_contract.py` computes every figure here):
#   100 orders x 73 API lines (the daily walk: 506 lines for 7 orders)    7,300 lines
#   three consoles polling once a minute for 14 hours                     2,520 lines
#     -- all 9,820 costed at 593 bytes, the longest line any route can write
#   the console check's `/readyz` every 5 minutes                           288 lines
#   the image's own HEALTHCHECK, `/healthz` every 30 s, day and night     2,880 lines
#     -- 3,168 at 441 bytes
#   = 7,220,060 bytes a day; fourteen days = 101,080,840 bytes.
# Docker drops the oldest file when it rotates, so the guaranteed history is (max-file - 1) x
# max-size = 49 x 2 MiB = 102,760,448 bytes = 14.2 busy days. The first version said 4 x 20 MiB =
# 15 days; it left out the healthcheck and costed a line at 553 bytes, and it was 11.6. Many small
# files rather than a few large ones because the guarantee is always one file short of the bound
# (the newest may have just been started), so the smaller the file, the more of the bound is
# history. Exactly the 100 MiB per-service bound the same test holds for the disk the database
# lives on.
x-api-logging: &api-logging
  driver: json-file
  options:
    max-size: "2m"
    max-file: "50"

x-runtime-hardening: &runtime-hardening
  logging: *default-logging
  init: true
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
  pids_limit: 128
  restart: unless-stopped
  stop_grace_period: 20s

x-disabled-capabilities: &disabled-capabilities
  FEATURE_PUBLIC_CHANNELS_ENABLED: "false"
  FEATURE_AUTOMATED_SENDS_ENABLED: "false"
  FEATURE_AGENT_RUNTIME_ENABLED: "false"

services:
  # Development convenience only. Private staging uses an externally managed PostgreSQL endpoint
  # reachable solely through the pre-provisioned database-private Docker network.
  postgres:
    profiles: ["local-database"]
    # `!reset`, not `[]`. An overlay's empty list *appends* nothing to compose.yaml's list, so
    # `ports: []` here left the development superuser published by the file below
    # (`OPS-HARDENING-002`); `compose.demo.yaml` had already found and fixed the same trap.
    ports: !reset []
    logging: *default-logging
    networks: [database-private]

  migrate:
    logging: *default-logging
    image: ${STAGING_API_IMAGE:-nha-trang-laundry-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    entrypoint: ["python", "-m", "nha_trang_laundry_db.migration_job"]
    command: []
    init: true
    user: "10003:10003"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    pids_limit: 32
    restart: "no"
    secrets:
      - source: staging_migration_database_url
        target: database_url
        uid: "10003"
        gid: "10003"
        mode: 0400
    networks: [database-private]

  api:
    <<: *runtime-hardening
    logging: *api-logging
    image: ${STAGING_API_IMAGE:-nha-trang-laundry-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    user: "10001:10001"
    environment:
      <<: *disabled-capabilities
      STAFF_ALLOWED_ORIGINS: "https://staging.internal:8443"
      API_TRUSTED_HOSTS: "staging.internal,api,localhost,127.0.0.1"
    secrets:
      - source: staging_api_database_url
        target: database_url
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: staging_oidc_issuer
        target: oidc_issuer
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: staging_oidc_audience
        target: oidc_audience
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: staging_oidc_jwks_url
        target: oidc_jwks_url
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: staging_oidc_mfa_claim
        target: oidc_mfa_claim
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: staging_oidc_mfa_value
        target: oidc_mfa_value
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: staging_hash_key
        target: hash_key
        uid: "10001"
        gid: "10001"
        mode: 0400
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [ingress-private, database-private]

  worker:
    <<: *runtime-hardening
    image: ${STAGING_WORKER_IMAGE:-nha-trang-laundry-worker:local}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    user: "10002:10002"
    environment:
      <<: *disabled-capabilities
      WORKER_INTERNAL_OUTBOX_ENABLED: "false"
      WORKER_AGENT_QUEUE_ENABLED: "false"
    secrets:
      - source: staging_worker_database_url
        target: database_url
        uid: "10002"
        gid: "10002"
        mode: 0400
      - source: staging_hash_key
        target: hash_key
        uid: "10002"
        gid: "10002"
        mode: 0400
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [database-private]

  tls:
    <<: *runtime-hardening
    image: ${STAGING_TLS_IMAGE:-nha-trang-laundry-tls:local}
    build:
      context: .
      dockerfile: deploy/staging/Caddy.Dockerfile
    user: "10004:10004"
    entrypoint: ["caddy"]
    command: ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - name: private-operator-https
        target: 8443
        published: "8443"
        host_ip: 127.0.0.1
        protocol: tcp
    configs:
      - source: staging_caddyfile
        target: /etc/caddy/Caddyfile
        uid: "10004"
        gid: "10004"
        mode: 0440
    secrets:
      - source: staging_tls_certificate
        target: tls_certificate
        uid: "10004"
        gid: "10004"
        mode: 0400
      - source: staging_tls_private_key
        target: tls_private_key
        uid: "10004"
        gid: "10004"
        mode: 0400
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
      - /config:rw,noexec,nosuid,nodev,size=4m,mode=0700,uid=10004,gid=10004
      - /data:rw,noexec,nosuid,nodev,size=4m,mode=0700,uid=10004,gid=10004
    depends_on:
      api:
        condition: service_healthy
    networks:
      ingress-private:
        aliases: [staging.internal]

configs:
  staging_caddyfile:
    file: deploy/staging/Caddyfile

secrets:
  staging_migration_database_url:
    external: true
  staging_api_database_url:
    external: true
  staging_worker_database_url:
    external: true
  staging_oidc_issuer:
    external: true
  staging_oidc_audience:
    external: true
  staging_oidc_jwks_url:
    external: true
  staging_oidc_mfa_claim:
    external: true
  staging_oidc_mfa_value:
    external: true
  # HASH-KEYING-001. The API and the worker both write keyed commitments -- the inbox writes
  # `payload_hash`, and every idempotent command writes `request_hash` -- so both need it, and
  # a service without it refuses the write rather than falling back to an unkeyed digest.
  staging_hash_key:
    external: true
  staging_tls_certificate:
    external: true
  staging_tls_private_key:
    external: true

networks:
  ingress-private:
    internal: true
    driver: bridge
  database-private:
    external: true
    name: ${STAGING_DATABASE_NETWORK:-nha-trang-laundry-staging-database-private}
