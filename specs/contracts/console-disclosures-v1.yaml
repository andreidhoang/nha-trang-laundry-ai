schema_version: 1
purpose: 'The staff console''s honesty-chrome disclosures, with what holds each one true. Coverage is
  stated precisely rather than absolutely, because the first version of this registry claimed to hold
  ''every'' disclosure while its enumerator could only see six object keys and the first paragraph of
  a notice - a claim that was true of the enumerator, not of the console. It now enumerates those keys,
  strings rendered with a props object under the claim classes, notice bodies, and the MESSAGES and REASON_NOTE
  tables in core/. A string rendered some other way is still outside it. Generated by scripts/generate_console_disclosure_registry.py
  and verified by scripts/verify_contracts.py against a fresh generation, so a new disclosure cannot land
  unregistered and a reworded one cannot pass unnoticed: a slot''s identity includes the hash of its text.'
