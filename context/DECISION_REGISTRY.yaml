    source: docs/DECISION_REQUEST_CREDIT_VS_PROMOTION_2026-09.md
    opened_at: '2026-09-18'
    question: >-
      The promotion engine answered PROMOTION_STACKING_REQUIRES_HUMAN with no rule behind it: a
      DEC-004 credit is a debt, a stacking_allowed:false programme is an offer, and nothing said
      which applies.
    resolved_at: '2026-09-25'
    decision_record: docs/DECISION_RECORD_FOUNDER_2026-09-25.md
    decided_under: >-
      Delegated authority, not an owner ratification, recorded as such so the registry stays true.
