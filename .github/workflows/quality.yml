name: quality

on:
  pull_request:
  push:
    branches: [main]
  # Manual trigger, so the gate can be proved to work without inventing a pull request to test it.
  #
  # Added because an audit on 2026-09-17 found this workflow had run **zero times since it was
  # registered on 2026-08-12**, across every pull request and every push to main in that window.
  # The workflow was never the problem -- the API reports it `active` -- so Actions itself was off
  # above it, and nothing in the repository said so. A `pull_request` status of "pending" with no
  # checks reads identically to "CI is still running", which is how five weeks passed.
  #
  # With this, `Actions → quality → Run workflow` answers "is the gate on?" in one click, on any
  # branch, without opening a throwaway pull request to find out.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci_app:ci-only-password@127.0.0.1:5432/nha_trang_laundry_ci"
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: nha_trang_laundry_ci
          POSTGRES_USER: ci_app
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_app -d nha_trang_laundry_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: test_openclaw_retirement re-verifies retired bytes against the commit
          # the retirement record names, and must fail, not skip, when that commit is absent.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      # Node runs the staff-console behaviour and syntax tests inside pytest; without it they skip.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: uv sync --all-packages --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy apps packages
      # PLATFORM-SECURITY-009 P5. Every test below runs as `ci_app`, the container superuser, so
      # a repository that needed a privilege the application roles do not hold -- or a worker grant
      # that forgot a table -- passed CI and failed in the shop. These steps provision the two
      # application roles the way a deployment does, apply the grants with the operator's script,
      # verify them, and run the role-separated smoke logged in AS those roles.
      - name: Create the application roles (CI-only passwords)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE laundry_api LOGIN PASSWORD 'ci-only-api'" \
            -c "CREATE ROLE laundry_worker LOGIN PASSWORD 'ci-only-worker'"
      - run: uv run python scripts/apply_migrations.py
      # CI's migrations run as `ci_app`, so it owns the schema and the default privileges are
      # declared for it; in a deployment the owner is `laundry_migrate`, the script's default.
      - run: uv run python scripts/apply_demo_grants.py --owner ci_app
      - run: uv run python scripts/verify_database_grants.py
      - name: Role-separated smoke (API write paths as laundry_api, worker paths as laundry_worker)
        env:
          LAUNDRY_API_DATABASE_URL: "postgresql://laundry_api:ci-only-api@127.0.0.1:5432/nha_trang_laundry_ci"
          LAUNDRY_WORKER_DATABASE_URL: "postgresql://laundry_worker:ci-only-worker@127.0.0.1:5432/nha_trang_laundry_ci"
        run: >-
          uv run pytest --require-postgres-integration -q
          packages/db/tests/test_api_role_write_paths.py
          apps/worker/tests/test_worker_least_privilege.py
      - run: uv run pytest --require-postgres-integration
      - run: uv run python scripts/verify_contracts.py
      - run: uv run python scripts/check_context_drift.py
      - run: uv run python scripts/report_delivery_status.py
