      summary: 'Thanh lý: the owner closes an order whose laundry nobody came back for (`DEC-036`).'
      x-authorization-dependencies:
      - require_disposal_owner
      - get_unclaimed_service
      x-documented-by-fastapi: true
      responses:
        '200':
          description: Success response.
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
  /internal/v1/orders/{order_id}/intake-transition:
    post:
      operationId: transition_order_intake
      summary: 'Move the order''s intake: the laundry arrived, was inspected, and was accepted for work.'
      x-authorization-dependencies:
      - require_operations_staff
      - get_operations_service
      x-documented-by-fastapi: true
      responses:
        '200':
          description: Success response.
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
  /internal/v1/orders/{order_id}/payments:
    post:
      operationId: record_payment
      summary: Take a deposit, a part payment or the rest, in cash or by bank transfer.
      x-authorization-dependencies:
      - require_operations_staff
      - get_operations_service
      x-documented-by-fastapi: true
      responses:
        '201':
