  - id: DEC-031
    title: "Reading DEC-004 where its words stop: item fee, loss, refunded orders"
    status: RESOLVED
    owner: BUSINESS_OWNER
    affected_capabilities: [INTERNAL_SHADOW, INCIDENT_RECEIPT]
    fail_closed_behavior: REQUIRE_HUMAN
    source: docs/DECISION_RECORD_FOUNDER_2026-09-25.md
    opened_at: '2026-09-18'
    question: >-
      DEC-004 caps loss/damage at 5x the item's cleaning fee but lines priced by weight have no per-
      item fee, the code applied the cap per line even to per-piece lines, loss defaulted to case-
      by-case negotiation with no path in the system, and nothing said whether a fully refunded
      order may still be compensated. DEC-004 itself is unchanged.
    resolved_at: '2026-09-25'
    decision_record: docs/DECISION_RECORD_FOUNDER_2026-09-25.md
    decided_under: >-
      Delegated authority, not an owner ratification, recorded as such so the registry stays true.
      The business owner wrote on 2026-09-25: "continue with the remaining follow-up items and make
      decisions as real founder of the business and lead engineer", extending the delegation
      recorded under DEC-028. Boundary kept: where no ratified figure exists, the ruling routes
      money to the owner's approval rather than letting it move by rule.
    resolution: >-
      (1) Item fee: per-piece services use the unit price (line divided by quantity); weight-priced
      services use the fee charged for the bag, the only number that exists. (2) Loss: the ratified
      5x ceiling applies and every loss claim needs the owner's approval whatever the amount; staff
      record and propose, never authorise; report window 24 hours from handover. (3) A refunded
      order may still be compensated for a damaged or lost garment, capped against the quoted fee,
      and always with the owner's approval; no late-delivery credit on a refunded bill. (4) Staff
      limit and ceiling remain cumulative per item. Addendum, same day (REMEDY-GARMENT-001): on a
      per-piece line the item is the garment a claim names by its 1-based position in the line's
      quantity, so the staff limit and the 5x ceiling are cumulative per (line, garment); claims
      recorded before migration 0052 count against every garment; weight-priced lines keep the
      per-line rule. An owner-only remedy envelope stays open until the end of the next business
      day in Asia/Ho_Chi_Minh instead of ten minutes; every other action keeps its window.
  - id: DEC-032
    title: May a self-collect customer pay the exact total at drop-off
    status: RESOLVED
    owner: BUSINESS_OWNER
    affected_capabilities: [INTERNAL_SHADOW, BOOKING]
    fail_closed_behavior: REQUIRE_HUMAN
    source: docs/DECISION_RECORD_FOUNDER_2026-09-25.md
    opened_at: '2026-09-18'
    question: >-
      A self-collect order could only be recorded as paid by ticking 'customer collected', so a
      customer paying at drop-off forced staff to record a handover that had not happened, or to
      refuse the money.
    resolved_at: '2026-09-25'
    decision_record: docs/DECISION_RECORD_FOUNDER_2026-09-25.md
    decided_under: >-
      Delegated authority, not an owner ratification, recorded as such so the registry stays true.
      The business owner wrote on 2026-09-25: "continue with the remaining follow-up items and make
      decisions as real founder of the business and lead engineer", extending the delegation
      recorded under DEC-028. Boundary kept: where no ratified figure exists, the ruling routes
      money to the owner's approval rather than letting it move by rule.
    resolution: >-
      Yes, the exact quoted total and nothing else, as DEC-023 already allows for delivery.
      Collection is recorded separately at pickup by the named staff member who hands the goods
      over; an order completes only when paid, released and collected. DEC-010 is not reopened:
      partial payment, deposits, instalments and account credit stay NOT_SUPPORTED. Addendum
      (2026-09-25, same authority): a PICKUP_ONLY customer pays at the shop counter only, the exact
      total, either when collecting or in advance at the counter before the laundry is finished,
      with the handover then recorded by the collection command; no payment by or to the courier
      (DEC-023).
