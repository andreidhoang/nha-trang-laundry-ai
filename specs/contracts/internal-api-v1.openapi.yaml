      - get_shop_capture_service
      x-documented-by-fastapi: true
      responses:
        '200':
          description: Success response.
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
  /internal/v1/orders/{order_id}/collection:
