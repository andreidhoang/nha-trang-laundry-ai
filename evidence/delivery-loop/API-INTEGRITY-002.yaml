work_item: API-INTEGRITY-002
recorded_at: '2026-09-25T15:00:00+07:00'
requirement_contract: A manual send's recipient is the approved draft's contact, never the operator's;
  a SEND_MESSAGE envelope binds a server-computed hash of a real draft; the unknown-send queue belongs
  to a store and its reconcile is idempotent.
rollback_impact: 0049 adds channel_send_receipts.store_id with NOT VALID constraints for new rows; receipts
  whose store cannot be derived stay NULL and appear in no queue. Migrations 0048-0051 are forward-only
  and additive; rolling data back is docs/runbooks/restore-drill.md from the base backup shop-till-mac.md
  section 8 takes before every upgrade.
unresolved_assumptions: Nothing yet lets a caller read a draft's binding, so staff cannot raise a valid
  SEND_MESSAGE envelope from the console; approvals.js still gives an outdated reason for MESSAGE_DRAFT.
  Listing now requires MFA.
evidence:
  the_recipient_is_bound_to_the_approved_draft: recipient_binding_id removed from the request (StrictRequest
    refuses it with 422); the recipient is derived from agent_drafts; an edit after approval blocks prepare
    and attest; composite FK ties an envelope's recipient to its draft's contact. 33 new tests red on
    d10fd64, green after; 10/10 mutants killed.
  unknown_send_receipts_are_store_scoped: GET /stores/{store_id}/shadow/unknown-sends with membership
    and MFA; another store's or an unassigned receipt is refused identically to a missing one; reconcile
    requires Idempotency-Key and a replay applies once.
  rollback_assessment: 0049 adds channel_send_receipts.store_id with NOT VALID constraints for new rows;
    receipts whose store cannot be derived stay NULL and appear in no queue. Migrations 0048-0051 are
    forward-only and additive; rolling data back is docs/runbooks/restore-drill.md from the base backup
    shop-till-mac.md section 8 takes before every upgrade.
