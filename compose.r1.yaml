# R1 — the shop runs on the console.
#
# One host, Zone C only: FastAPI, the worker, PostgreSQL and the TLS proxy. No public ingress and
# no agent cell, because R1 connects no channel and invokes no model. ADR-0007 §1 permits exactly
# this shape and says why: Zone P and Zone A exist to process untrusted language, and "if cost
# forces one host, the correct response is to delay public ingress, not to collapse the boundary."
#
# **Why this is a separate file from `compose.production.yaml`.** That file is honestly named
# `nha-trang-laundry-private-staging`: it describes a private staging host, its acceptance commands
# are cited by the recorded evidence of three COMPLETE items, and
# `packages/evals/tests/test_staging_deployment_contract.py` asserts its service set is exactly
# {api, migrate, tls, worker}. Renaming it, or adding services to it, would rewrite closed evidence
# to describe a topology it never ran.
#
# **The defect this file fixes.** `compose.production.yaml` attaches `tls` only to
# `ingress-private`, which is `internal: true`. Docker accepts the `127.0.0.1:8443` port
# declaration and then silently discards it -- `HostConfig.PortBindings` asks for the binding,
# `NetworkSettings.Ports` comes back empty, the network has no gateway, and nothing reports an
# error. The one host listener `docs/runbooks/private-staging.md` promises does not exist.
# `compose.demo.yaml:131-142` recorded that and worked around it for the demo only, saying the
# production fix "belongs to its own reviewed item". This is that item, and the fix is the
# `ingress-edge` network below.

name: nha-trang-laundry-shop

x-runtime-hardening: &runtime-hardening
  init: true
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
  pids_limit: 128
  restart: unless-stopped
  stop_grace_period: 20s

# Deploying the code never enables a capability. `WorkerSettings` raises if any of the three is
# true, and `delivery/GATE_REGISTRY.yaml` is what would change that -- not this file.
x-disabled-capabilities: &disabled-capabilities
  FEATURE_PUBLIC_CHANNELS_ENABLED: "false"
  FEATURE_AUTOMATED_SENDS_ENABLED: "false"
  FEATURE_AGENT_RUNTIME_ENABLED: "false"

services:
  # Only when the hosting decision selects a self-managed database. A provider-managed endpoint with
  # PITR leaves this profile off and reaches the provider over `database-private` instead. The
  # branch is a profile rather than a second file so the two cannot drift apart.
  postgres:
    profiles: ["self-managed-database"]
    image: ${R1_POSTGRES_IMAGE:-nha-trang-laundry-postgres:local}
    build:
      context: .
      dockerfile: deploy/production/Postgres.Dockerfile
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # The image's own postgres user, not the 1000x numbering the application services use: the data
    # directory has to be owned by the server's uid and the base image fixes it. Recorded here so it
    # reads as a decision rather than an oversight.
    user: "70:70"
    pids_limit: 128
    restart: unless-stopped
    # Longer than the 20s the application services take. A shutdown that kills a checkpoint
    # mid-flight is paid back as recovery time on the next start.
    stop_grace_period: 120s
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports: []
    environment:
      POSTGRES_DB: nha_trang_laundry
      POSTGRES_USER: laundry_migrate
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # `archive_command` uploads from inside this container, so it needs egress to the archive
      # repository and nothing else. Compose cannot express that restriction; host firewall rules
      # can, and the runbook says so.
      BACKUP_REPOSITORY_PREFIX: ${R1_BACKUP_REPOSITORY:-}
      BACKUP_UPLOAD_COMMAND: ${R1_BACKUP_UPLOAD_COMMAND:-}
    configs:
      - source: r1_postgresql_conf
        target: /etc/postgresql/postgresql.conf
        uid: "70"
        gid: "70"
        mode: 0440
      - source: r1_archive_wal
        target: /usr/local/bin/archive-wal.sh
        uid: "70"
        gid: "70"
        mode: 0550
    secrets:
      - source: r1_postgres_password
        target: postgres_password
        uid: "70"
        gid: "70"
        mode: 0400
      - source: r1_backup_encryption_recipients
        target: backup_encryption_recipients
        uid: "70"
        gid: "70"
        mode: 0400
      - source: r1_backup_repository_credential
        target: backup_repository_credential
        uid: "70"
        gid: "70"
        mode: 0400
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /run/postgresql:rw,noexec,nosuid,nodev,size=8m,mode=0700,uid=70,gid=70
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laundry_migrate -d nha_trang_laundry"]
      interval: 10s
      timeout: 5s
      retries: 12
    # `archive-egress` is the honest cost of an `archive_command` that does not lie about
    # durability. Restrict the destination with host firewall rules; compose cannot.
    networks: [database-private, archive-egress]

  migrate:
    image: ${R1_API_IMAGE:-nha-trang-laundry-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    entrypoint: ["python", "-m", "nha_trang_laundry_db.migration_job"]
    command: []
    init: true
    user: "10003:10003"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    pids_limit: 32
    restart: "no"
    secrets:
      - source: r1_migration_database_url
        target: database_url
        uid: "10003"
        gid: "10003"
        mode: 0400
    networks: [database-private]

  api:
    <<: *runtime-hardening
    image: ${R1_API_IMAGE:-nha-trang-laundry-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    user: "10001:10001"
    environment:
      <<: *disabled-capabilities
      # The console is served by this container (`main.py` mounts `apps/web` at `/staff`), so the
      # origin it is reached on and the origin it calls are the same by construction. That is what
      # makes the strict-SameSite cookie and the double-submit CSRF token work.
      STAFF_ALLOWED_ORIGINS: "https://${R1_CONSOLE_HOST:-console.giatlasachcong.lan}:8443"
      # `127.0.0.1` stays: the container healthcheck calls `/healthz` on the loopback address, and
      # `TrustedHostMiddleware` would reject it otherwise, leaving the container unhealthy forever.
      API_TRUSTED_HOSTS: "${R1_CONSOLE_HOST:-console.giatlasachcong.lan},localhost,127.0.0.1"
    secrets:
      - source: r1_api_database_url
        target: database_url
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: r1_oidc_issuer
        target: oidc_issuer
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: r1_oidc_audience
        target: oidc_audience
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: r1_oidc_jwks_url
        target: oidc_jwks_url
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: r1_oidc_mfa_claim
        target: oidc_mfa_claim
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: r1_oidc_mfa_value
        target: oidc_mfa_value
        uid: "10001"
        gid: "10001"
        mode: 0400
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [ingress-private, database-private]

  worker:
    <<: *runtime-hardening
    image: ${R1_WORKER_IMAGE:-nha-trang-laundry-worker:local}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    user: "10002:10002"
    environment:
      <<: *disabled-capabilities
      WORKER_INTERNAL_OUTBOX_ENABLED: "false"
      WORKER_AGENT_QUEUE_ENABLED: "false"
    secrets:
      - source: r1_worker_database_url
        target: database_url
        uid: "10002"
        gid: "10002"
        mode: 0400
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [database-private]

  # DEC-011, ratified 2026-08-18: the production staff identity provider, self-hosted in Zone C so
  # staff PII never leaves the owner-controlled host. It is a hard dependency of staff sign-in, and
  # the JWKS-outage behaviour that follows from that is stated in `apps/api/.../main.py` beside the
  # dependency that constructs the verifier.
  keycloak:
    <<: *runtime-hardening
    image: ${R1_IDP_IMAGE:-nha-trang-laundry-idp:local}
    build:
      context: .
      dockerfile: deploy/production/Keycloak.Dockerfile
    user: "10005:10005"
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD_FILE: /run/secrets/keycloak_database_password
      # TLS terminates at the proxy on an internal network; Keycloak is never reachable from the
      # host. `KC_HOSTNAME` is the browser-facing origin, which is what it stamps into `iss`.
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /idp
      KC_HOSTNAME: "https://${R1_CONSOLE_HOST:-console.giatlasachcong.lan}:8443/idp"
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "false"
      # The realm's client uses a relative redirect URI, resolved against this. One variable
      # configures the origin in three places rather than three literals drifting apart -- measured:
      # with no root URL, Keycloak answers a relative redirect URI with "Invalid parameter:
      # redirect_uri" and no login form is ever rendered.
      R1_CONSOLE_ORIGIN: "https://${R1_CONSOLE_HOST:-console.giatlasachcong.lan}:8443"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_bootstrap_admin_password
    configs:
      - source: r1_keycloak_realm
        target: /opt/keycloak/data/import/realm-nhatrang.json
        uid: "10005"
        gid: "10005"
        mode: 0440
    secrets:
      - source: r1_keycloak_database_password
        target: keycloak_database_password
        uid: "10005"
        gid: "10005"
        mode: 0400
      - source: r1_keycloak_bootstrap_admin_password
        target: keycloak_bootstrap_admin_password
        uid: "10005"
        gid: "10005"
        mode: 0400
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /opt/keycloak/data/tmp:rw,noexec,nosuid,nodev,size=64m,mode=0700,uid=10005,gid=10005
    # No `ingress-edge`, no `archive-egress`: Keycloak has no outbound need -- no email, no
    # federation, no external identity provider.
    networks: [ingress-private, database-private]

  tls:
    <<: *runtime-hardening
    image: ${R1_TLS_IMAGE:-nha-trang-laundry-tls:local}
    build:
      context: .
      dockerfile: deploy/staging/Caddy.Dockerfile
    user: "10004:10004"
    entrypoint: ["caddy"]
    command: ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - name: shop-operator-https
        target: 8443
        # The default is deliberately loopback: an unset variable produces a console nobody can
        # reach, not a console everybody can. Set it to the shop LAN address, or better to a
        # WireGuard address, so the port is not on the LAN at all.
        published: "8443"
        host_ip: ${R1_CONSOLE_BIND_IP:-127.0.0.1}
        protocol: tcp
    configs:
      - source: r1_caddyfile
        target: /etc/caddy/Caddyfile
        uid: "10004"
        gid: "10004"
        mode: 0440
    secrets:
      - source: r1_tls_certificate
        target: tls_certificate
        uid: "10004"
        gid: "10004"
        mode: 0400
      - source: r1_tls_private_key
        target: tls_private_key
        uid: "10004"
        gid: "10004"
        mode: 0400
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
      - /config:rw,noexec,nosuid,nodev,size=4m,mode=0700,uid=10004,gid=10004
      - /data:rw,noexec,nosuid,nodev,size=4m,mode=0700,uid=10004,gid=10004
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_started
    volumes:
      - ./deploy/production/signin:/srv/signin:ro
    environment:
      R1_CONSOLE_HOST: "${R1_CONSOLE_HOST:-console.giatlasachcong.lan}"
    networks:
      ingress-edge:
      ingress-private:
        aliases: ["${R1_CONSOLE_HOST:-console.giatlasachcong.lan}"]

configs:
  r1_caddyfile:
    file: deploy/production/Caddyfile
  r1_postgresql_conf:
    file: deploy/production/postgresql.conf
  r1_archive_wal:
    file: deploy/production/backup/archive-wal.sh
  r1_keycloak_realm:
    file: deploy/production/keycloak/realm-nhatrang.json

secrets:
  r1_migration_database_url:
    external: true
  r1_api_database_url:
    external: true
  r1_worker_database_url:
    external: true
  r1_oidc_issuer:
    external: true
  r1_oidc_audience:
    external: true
  r1_oidc_jwks_url:
    external: true
  r1_oidc_mfa_claim:
    external: true
  r1_oidc_mfa_value:
    external: true
  r1_tls_certificate:
    external: true
  r1_tls_private_key:
    external: true
  r1_postgres_password:
    external: true
  r1_keycloak_database_password:
    external: true
  r1_keycloak_bootstrap_admin_password:
    external: true
  r1_backup_encryption_recipients:
    external: true
  r1_backup_repository_credential:
    external: true

networks:
  # The fix. `tls` is the only service attached to a non-internal network, so the published port is
  # a real listener; every other service stays unreachable from the host. Attaching a second service
  # here would put it on the host's network, which is why the contract test asserts the membership
  # of this network exactly rather than merely that it exists.
  ingress-edge:
    internal: false
    driver: bridge
  ingress-private:
    internal: true
    driver: bridge
  database-private:
    internal: true
    driver: bridge
  archive-egress:
    internal: false
    driver: bridge

volumes:
  pgdata:
