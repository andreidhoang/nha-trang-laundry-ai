      responses:
        '200':
          description: Success response.
      parameters:
      - name: manual_send_id
        in: path
        required: true
        schema:
          type: string
  /internal/v1/orders/{order_id}:
    get:
      operationId: read_order
      summary: One order, by id, for a member of the store the order belongs to.
      x-authorization-dependencies:
      - current_principal
      - get_operations_service
      x-documented-by-fastapi: true
      responses:
        '200':
          description: Success response.
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
  /internal/v1/orders/{order_id}/account-charge:
