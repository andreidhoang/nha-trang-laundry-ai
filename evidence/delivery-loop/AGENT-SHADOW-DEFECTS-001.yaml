  contained. Telegram sandbox contacts are classified as real customers and refused a model call -- a
  founder call, recorded in the merge commit.
evidence:
  a_deterministic_handoff_is_filed_as_require_human: 'The reviewer''s repro printed ''filed as: DRAFT''
    before; after, the row is REQUIRE_HUMAN / PROVIDER_TIMEOUT; 3/3 mutants killed.'
  a_timed_out_run_records_its_own_failure: The job deadline ends 5 s before the lease; a stale claim returns
    CLAIM_LOST instead of escaping run_once; completion and draft filing share one claim-checked transaction;
    12/12 mutants killed including another worker recovering the run mid-flight in PostgreSQL.
  the_pinned_prompt_and_registry_are_the_ones_that_execute: Pins travel from claim to job and a mismatch
    fails RUNTIME_PIN_MISMATCH with 0 provider requests; 7/7 mutants killed.
  an_agent_approval_binds_server_rendered_content: render_quote_presentation renders from the stored,
    hash-checked revision; the model's rendered_hash is never read; 5/5 mutants killed.
  the_real_customer_lock_is_not_a_self_declared_label: Migration 0050 derives data_classification on insert
    and overwrites any supplied value; PolicyDecisionPoint.evaluate_agent_run is called after claim, before
    the runner; 8/8 mutants killed. All 13 capabilities remain NOT_AUTHORIZED (report_delivery_status.py).
  rollback_assessment: 0050 adds a classification trigger and a call ledger; a code revert leaves both
    harmlessly in place. The local evidence bundle moves to v4 by the documented capture script; v1-v3
    are untouched. Migrations 0048-0051 are forward-only and additive; rolling data back is docs/runbooks/restore-drill.md
    from the base backup shop-till-mac.md section 8 takes before every upgrade.
