schema_version: 1
purpose: >-
  Name which local synthetic evidence bundle is current and which are superseded, so that
  re-derivation never leaves the question to convention. Written by EVIDENCE-REPIN-001 after the
  owner chose option 1 of context/tasks/TASK-evidence-repin-001.md on 2026-08-13.
rules:
  - A superseded bundle is retained forever and its bytes never change; it is the historical record
    of what it attested.
  - A new bundle is derived by scripts/capture_local_agent_evidence.py against the tree, never by
    editing hashes. A hand-adjusted bundle is a fabricated attestation.
  - Exactly one bundle is current. Changing which one is current means editing this file and the
    guarded suite together, in the same change.
  - This index is deliberately not hash-pinned by any bundle. A pointer inside the thing it points
    at cannot be updated without invalidating itself.
current:
  path: evidence/agent-shadow/local-synthetic-suite-v4.json
  derived_by: scripts/capture_local_agent_evidence.py
  release_effect: NONE
superseded:
  - path: evidence/agent-shadow/local-synthetic-suite-v3.json
    sha256: sha256:ca51d935e4eb862e936e1cb562e1c54d17f0f91d1aea118e2def051249ef2670
    superseded_on: '2026-09-25'
    superseded_by: evidence/agent-shadow/local-synthetic-suite-v4.json
    work_item: AGENT-SHADOW-DEFECTS-001
    reason: >-
      A review of the agent runtime reproduced defects in three files this bundle pins.
      `agent_runner.py` filed every deterministic handoff as a model draft, dropped the release
      pins a run was queued for, and ran to a deadline equal to its claim's lease; `graders.py`
      let an unmeasured negative fact pass a safety assertion; `runner.py` reported "consent
      projection unchanged" as a constant. Fixing them moved those pins, so the bundle was
      re-derived rather than hand-edited, per this index's own rules, and
      `scripts/capture_local_agent_evidence.py` moved with it so a bare re-run cannot overwrite
      this record. Every case status (32 SKIP), the release-blocker list and the
      DETERMINISTIC_DEGRADED runtime path are unchanged; no case reports a missing observation.
  - path: evidence/agent-shadow/local-synthetic-suite-v2.json
    sha256: sha256:753cbd1ce293a3b1cda59f5f2ab897ed01d44feff66f6eab591138577f5f5fe7
    superseded_on: '2026-09-09'
    superseded_by: evidence/agent-shadow/local-synthetic-suite-v3.json
    work_item: SHOP-READINESS-AUDIT-001
    reason: >-
      An audit found that `specs/contracts/release-gate-manifest-v1.schema.json` carried no numeric
      floor for `automated_sends_human_reviewed` at the gate that requires it. G3 asks for the first
      200 automated sends to have been reviewed by a human; the only `minimum: 200` lived in the
      BOUNDED clause, so a manifest could claim G3 satisfied with zero and nothing mechanical
      objected until the stage after the one the requirement governs. The floor is keyed on the
      gate claimed in `gate_evidence` rather than on the stage, because G2 and G3 are both ASSISTED
      and only G3 carries it. That schema is pinned by this bundle, so the bundle was re-derived
      rather than hand-edited, per this index's own rules. Two pins moved: the schema, and
      `scripts/capture_local_agent_evidence.py`, whose default output and supersession list name
      the new current bundle so a bare re-run cannot overwrite this record. Every case status, the
      release-blocker list and the DETERMINISTIC_DEGRADED runtime path are unchanged.
  - path: evidence/agent-shadow/local-synthetic-suite-v1.json
    sha256: sha256:2a52cfaac55ec4fa8b9d6e93a5987d3b619e33d33aafd8c5eb5d50d3572aefec
    superseded_on: '2026-08-13'
    superseded_by: evidence/agent-shadow/local-synthetic-suite-v2.json
    work_item: EVIDENCE-REPIN-001
    reason: >-
      Frozen by ADR-0004 as AGENT-001's artifact, it hash-pinned 21 core files and so acted as a
      change freeze on the core, blocking six items — two on the G1 critical path — and every
      provider-candidate question. Re-derivation moved exactly one pin,
      scripts/capture_local_agent_evidence.py, whose default output now names the current bundle so
      a bare re-run cannot overwrite this record. Every case status, the release-blocker list and the
      DETERMINISTIC_DEGRADED runtime path are unchanged between the two bundles.
