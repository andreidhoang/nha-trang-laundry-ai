  from the base backup shop-till-mac.md section 8 takes before every upgrade.
unresolved_assumptions: Deadlocks stay 500. claim_execution still uses the echo check. Quote rendered_hash
  is not recomputed at decision time (four actions share QUOTE_REVISION with different renderings); executors
  still check it.
