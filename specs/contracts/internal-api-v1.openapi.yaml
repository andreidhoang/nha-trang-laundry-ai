      - get_operations_service
      x-documented-by-fastapi: true
      responses:
        '201':
          description: Success response.
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
  /internal/v1/orders/{order_id}/disposal:
    post:
