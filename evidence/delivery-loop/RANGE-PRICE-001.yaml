    status: PASSED
    result: 86 ok, 1 failed (coverage only), 0 crashes
    note: >-
      2026-09-23, against the same real stack. The one remaining failure is the script's own
      coverage line -- 40 of 49 declared controls exercised -- which is information rather than a
      defect: the nine untouched are staff-management and assistant controls no scenario in this set
      drives.

      The first run of this script reported seven failures and every one was in the test estate, not
      the product. Three asserted that incident intake was impossible, which `INCIDENT-INTAKE-001`
      fixed on 2026-09-18, so they were failing because the product improved. Two replayed a version
      from before a move, because `stored()` silently needs `--psql-container`, so the server's
      correct concurrency refusal read as a failure. One was caused by the lead killing the API
      mid-run. A virgin database reproduced the result identically, which is what ruled out fixture
      state and forced the real root cause.
