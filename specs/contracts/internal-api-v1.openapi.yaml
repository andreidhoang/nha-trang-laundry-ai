x-served-mounts:
  /staff: 'Static staff PWA assets served by StaticFiles (name=staff-pwa). Not an API operation and deliberately
    unauthenticated: it serves the console shell, and every datum the console shows comes from an authorized
    /internal/v1 call made after it loads.'
