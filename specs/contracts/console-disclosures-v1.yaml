    phải mô hình đang sinh từ. Mọi lượt hỏi đều được ghi lại kèm người hỏi.
  binding:
    kind: MODEL_SEAM
    service: AssistantService
    default_brain: DeterministicAssistantBrain
    why: The disclosure this item exists for. It tells operators the streamed text is display pacing of
      an already-saved answer, not a model generating words. That holds only while AssistantService defaults
      to the deterministic brain. Passing a provider-backed brain to AssistantService(brain=...) is a
      one-line change at a seam that exists so the swap can happen, and it makes the sentence false with
      nothing else in the repository noticing. The test asserts the default.
