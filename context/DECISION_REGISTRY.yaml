  - id: DEC-015
    title: What a customer record is, and when a person becomes one
    status: RESOLVED
    owner: BUSINESS_OWNER
    affected_capabilities: [INTERNAL_SHADOW, QUOTE_ESTIMATE, BOOKING, MARKETING_FOLLOWUP]
    fail_closed_behavior: REQUIRE_HUMAN
    source: docs/DECISION_REQUEST_ACQUISITION_2026-08.md
    opened_at: '2026-08-18'
    supersedes_recommendation: >-
      docs/PRODUCTION_READINESS_ASSESSMENT.md and docs/STAFF_CONSOLE_COMPLETION_PROGRAM_V1.md both
      recommend opening this decision as DEC-011. DEC-011 was subsequently used for the staff
      identity provider, so the recommendation is honoured under this id instead. No existing
      decision changes; apps/web/src/screens/gaps.js is corrected to point here.
    question: >-
      The system can record zero customers from any source: CreateOrderCommand requires
      bound_contact_id, the only writer of contact_channel_bindings is keyed on a messaging-provider
      identity, the provider column admits only ZALO_OA, TELEGRAM_SANDBOX and FACEBOOK_MESSENGER,
      and no provider is connected. DEC-013 covers the counter case narrowly; this is the wider
      question it sits inside. The owner decides whether a customer record (a parties aggregate with
      contact points and addresses) exists at all; what may be stored about an organisation the shop
      has researched but never spoken to; and what consent wording a customer actually agrees to,
      with its version, so that an affirmative CLEAR suppression state can ever be written.
    blocking_today: >-
      ACQUISITION-001 is written (context/tasks/TASK-acquisition-001.md) and deliberately not
      enqueued. The researched prospect list ships as templates/accounts.csv holding organisations
      only, with no individual's name, personal mobile or personal email, because storing those
      would create a personal-data processing record for parties who have not been asked.
    resolved_at: '2026-08-26'
    decision_record: docs/DECISION_REQUEST_ACQUISITION_2026-08.md
    resolution: >-
      Owner ratified the engineering recommendation on record — not yet — in Vietnamese on
      2026-08-26: "Chưa xây lớp hồ sơ khách hàng. Khách vãng lai dùng số phiếu (DEC-013); khách nhắn
      tin dùng ràng buộc kênh đã có. Danh sách khách tiềm năng chỉ lưu tổ chức. Quyết định này mở
      lại khi có kênh liên lạc chính thức."

      No `parties` aggregate, no contact points, no addresses. A customer record should exist when
      there is both a use for it and a lawful basis, and today there is neither: no channel is
      connected and nobody has been asked. The prospect list stays organisations-only.

      This is "not yet", not "never". It reopens the day `CHANNEL-TELEGRAM-001` or an official Zalo
      OA carries a real conversation, because that is the day a customer record has both a purpose
      and a consent event to rest on.

      Consequence for order creation, decided here rather than left implicit: `bound_contact_id` has
      two legitimate sources — a counter ticket under DEC-013 and a channel binding — and they are
      deliberately not unified behind a party layer, because unifying them is the CRM this decision
      declines to build. `OrderRepository.create` therefore checks the reference against both
      sources rather than through one foreign key.
  - id: DEC-016
    title: Who staffs the inbound channel, and whose account it is
    status: OPEN
    owner: BUSINESS_OWNER
    affected_capabilities: [PUBLIC_FAQ, LIST_PRICE_INFO, INTAKE_QUESTION, ORDER_STATUS]
    fail_closed_behavior: NOT_SUPPORTED
    source: docs/DECISION_REQUEST_ACQUISITION_2026-08.md
    opened_at: '2026-08-18'
    question: >-
      BUSINESS_TRUTH_INTAKE.md carries the field "Người trực inbound:" and it is blank, while the
      same document commits the business to a 5-10 minute response between 08:00 and 20:00 and
      records the Zalo presence as an account on the owner's own hotline number, not a confirmed
      Zalo OA. Two staff cover 08:00-20:00 and also wash, fold and deliver. The owner decides who
      answers inbound by name and in which hours, whether the channel belongs to the company or to a
      person, and what the shop says outside opening hours.
    blocking_today: >-
      Nothing is broken because no channel is connected. But every acquisition motion ends with a
      stranger sending a message, so CHANNEL-TELEGRAM-001 and CHANNEL-ZALO-APPLY-001 should not
      start before this is answered - they deliver strangers to a phone with no named owner, and an
      assistant answering out of hours would make promises no human is behind.


      2026-09-09, partially answered and therefore still OPEN. The owner named Hoài Ngọc as the
      person who answers inbound, which settles the first of the three questions and fills the blank
      "Người trực inbound:" line in BUSINESS_TRUTH_INTAKE.md section 1. Two questions remain and
      both are the ones that decide whether a channel may be connected: whether the channel account
      belongs to CÔNG TY TNHH A & T CARE or to a person, and what the shop says outside 08:00-20:00.
      The account question is not paperwork - the Zalo presence today is an account on the personal
      hotline 0382 318 492, so the shop's customer relationships currently leave with whoever holds
      that number.


      One observation this answer surfaces rather than settles: the same person is now recorded as
      the legal representative, a co-owner, the name on the shop front and the sole inbound
      responder, in a business where two staff cover 08:00-20:00 and also wash, fold and deliver.
      The 5-10 minute response commitment in section 4 of the intake document rests entirely on one
      person's availability. That is a fact for the owner to weigh, not a blocker this registry can
      resolve.
  - id: DEC-017
    title: Which name the shop goes to market under, and the franchise relationship behind it
    status: RESOLVED
    owner: BUSINESS_OWNER
    affected_capabilities: [PUBLIC_FAQ, LIST_PRICE_INFO, MARKETING_FOLLOWUP]
    fail_closed_behavior: NOT_SUPPORTED
    source: docs/DECISION_REQUEST_ACQUISITION_2026-08.md
    opened_at: '2026-08-18'
    question: >-
      Verified 2026-08-18 from public sources: "Giặt Là Sạch Cộng" is a national franchise chain
      headquartered in Hanoi claiming 500+ stores across 48 provinces and actively selling
      franchises; its public store directory lists no store in Khánh Hòa. CÔNG TY TNHH A & T CARE,
      MST 4202059758, at 3A Lê Đại Hành is confirmed in public registry listings.
      BUSINESS_TRUTH_INTAKE.md records the brand name as confirmed and sets an identity rule, but
      records no franchise relationship, and no agreement, licence or territory grant exists in this
      repository. Whether one exists is a fact only the owner has and is not assumed here. The owner
      decides which identity goes on customer-facing assets, given that a brand search returns the
      Hanoi franchisor and hundreds of other stores rather than this shop.
    blocking_today: >-
      No customer-facing asset is produced under either name. SALES_AND_NURTURE_PLAYBOOK.md already
      forbids issuing the one-page B2B offer while any field is a guess, and the name is now one of
      those fields. The prospect list, the visit route and the offer draft are internal only.
    resolved_at: '2026-09-09'
    decision_record: docs/DECISION_REQUEST_ACQUISITION_2026-08.md
    resolution: >-
      Owner answered both halves on 2026-09-09.


      **There is no franchise agreement.** The shop holds no agreement, licence or territory grant
      with the Hà Nội chain that trades under this name. The identity rule in
      BUSINESS_TRUTH_INTAKE.md section 1 was therefore resting on an assumption, and now rests on a
      recorded answer: it is the owner's own choice of name, not a franchisor's grant.


      **The business name stays "Giặt Là Sạch Cộng"**, reconfirmed by the owner in the same answer,
      and the B2B contract name stays CÔNG TY TNHH A & T CARE, MST 4202059758, which was never in
      question. **Hoài Ngọc** is recorded as the legal representative, a co-owner, the name on the
      shop front, and the person who answers inbound (the last of these belongs to DEC-016, which
      stays open on its other two questions).


      Two consequences follow from "no agreement" and both are recorded rather than argued:


      The first is trademark exposure. The chain is a going concern actively selling franchises, and
      a name used without a grant is a name that can be objected to - most expensively after it is
      printed on leaflets, painted on a QR code and verified on a Google listing. This is now a
      known and accepted risk carried by the owner rather than an unrecorded assumption carried by
      this repository, which is the whole point of the decision. Whether to take legal advice before
      printing is the owner's call.


      The second is practical and independent of the first: **the brand name does not find this
      shop.** A search for it returns the Hà Nội franchisor, its franchise-sales funnel, and
      hundreds of stores with the same name in other provinces; the chain's own public directory
      lists no store in Khánh Hòa. A hotel manager checking who they are about to hand forty
      bedsheets to lands on a page selling franchises. So findability has to be built on the two
      things that resolve to this shop and nothing else - **the shop-front name and the address** -
      with the brand name carried alongside rather than relied on to do the finding.


      That makes one physical fact load-bearing and it is the single thing still outstanding: **the
      exact text painted on the shop front.** Google's Business Profile naming rule requires the
      profile name to be the real-world name as used on the storefront, keyword-stuffed or
      mismatched names are the most common cause of suspension, and the verification step for a shop
      this size is a continuous video of the frontage - so the sign will be read by Google whether
      or not it matches what was typed. It is not knowable from this repository and is settled by
      one photograph. Until it is, no Google profile name is claimed and nothing customer-facing is
      printed. Everything else DEC-017 blocked is unblocked.
  - id: DEC-018
    title: What purge means when the same bytes are both disposable payload and retained evidence
    status: RESOLVED
    owner: BUSINESS_OWNER
    affected_capabilities: [INTERNAL_SHADOW, PUBLIC_FAQ, LIST_PRICE_INFO, ORDER_STATUS]
    fail_closed_behavior: NOT_SUPPORTED
    source: docs/DECISION_REQUEST_RETENTION_EXECUTION_2026-08.md
    opened_at: '2026-08-18'
    question: >-
      DEC-008 signs raw webhook payload 30d PURGE and, in the same sentence, consent evidence
      retained indefinitely. consent_events.evidence_webhook_id is NOT NULL and references
      webhook_events(id), so for a STOP message those two instructions land on the same row: the
      ciphertext scheduled for deletion at 30 days IS the evidence for a withdrawal retained
      forever. The same shape recurs on inbox_replay_conflicts.webhook_event_id and
      agent_runs.source_webhook_event_id. Separately, the assistant answer is persisted a second
      time into command_idempotency_records.response, and protect_idempotency_record raises on
      DELETE and on any update of a completed record, so the signed 180-day transcript purge would
      leave a byte-identical copy in a row nothing may ever remove. The owner decides which rule
      wins when a payload is also evidence, whether a partial purge may be called a purge, and
      whether a corrective item should stop the assistant answer being stored twice.
    blocking_today: >-
      SUPPORTED_PURGE_CLASSES stays empty and every class refuses, so nothing is disposed of and
      nothing claims to be. RETENTION-STORE-001 is BLOCKED on this: the two classes with a
      separable backing store today are exactly the two this question governs.
    resolved_at: '2026-09-17'
    decision_record: docs/DECISION_REQUEST_RETENTION_EXECUTION_2026-08.md
    resolution: >-
      Owner ratified the engineering recommendation on record on 2026-09-17 ("I ratify
      DEC-018/019/020"). The reasoning was written by the engineering role and put to the owner
      rather than recorded as decided; the ratification is what closes this entry.

      Evidence wins. When a payload is also evidence, a purge run holds back the rows it may not
      delete, records the count and the reason in its own run record, and reports
      COMPLETED_WITH_EXEMPTIONS — never COMPLETED over a silent exemption. The rule applies
      identically to inbox_replay_conflicts.webhook_event_id and agent_runs.source_webhook_event_id:
      a pointer from a longer-lived record pins its target. The reason is asymmetry of harm —
      deleting the ciphertext of a DỪNG destroys the only proof the shop was told to stop, and its
      absence is indistinguishable from never having been told; keeping a payload longer than
      scheduled harms nobody in a way anyone can point at.

      A partial purge is not a purge. ASSISTANT_TRANSCRIPT stays NOT_SUPPORTED until the duplicate
      in command_idempotency_records.response stops being written, because deleting assistant_turns
      while a byte-identical copy survives under protect_idempotency_record would be a false
      statement made by software.

      The corrective item is opened as ASSISTANT-RETENTION-001. ASSISTANT-001 stays COMPLETE and is
      not rewritten. Preferred but non-binding direction: an idempotency record answers a retry, a
      horizon of minutes to hours, so giving those records their own short purgeable lifetime
      removes the duplicate by expiry rather than surgery.

      Accepted residual with a scheduled fix: request_hash and payload_hash are unsalted SHA-256
      commitments that outlive every purge and are dictionary-reversible for short Vietnamese
      messages. Both move to a keyed HMAC under a per-deployment secret, which preserves equality
      comparison exactly and therefore replay defence. Scheduled as HASH-KEYING-001, not blocking.
  - id: DEC-019
    title: Which retention class covers AI-generated draft text and a human's edit of it
    status: RESOLVED
    owner: BUSINESS_OWNER
    affected_capabilities: [INTERNAL_SHADOW]
    fail_closed_behavior: NOT_SUPPORTED
    source: docs/DECISION_REQUEST_RETENTION_EXECUTION_2026-08.md
    opened_at: '2026-08-18'
    question: >-
      agent_drafts.draft_text holds up to 4000 characters of model-composed customer-facing text and
      agent_draft_reviews.edited_text holds the human-edited version. Neither is named by any class
      in retention.py or by any schedule in DEC-008. A sweep of every text, jsonb and bytea column
      across all 41 tables found the same condition on approval_decisions.note,
      channel_send_receipts.resolution_note, staff_users.display_name and email,
      contact_channel_bindings.provider_user_ref, and the jsonb payload columns on
      approval_requests, outbox_events, domain_events and command_idempotency_records. The owner
      decides which class an AI draft belongs to, whether a human's edit inherits it, and whether
      the remaining columns are deliberately out of scope.
    blocking_today: >-
      Nothing, because none of those columns holds real customer data yet. SHADOW-001 is the point
      at which that stops being true, so the obligation attaches before that item, not after it.
    resolved_at: '2026-09-17'
    decision_record: docs/DECISION_REQUEST_RETENTION_EXECUTION_2026-08.md
    resolution: >-
      Owner ratified the engineering recommendation on record on 2026-09-17 ("I ratify
      DEC-018/019/020").

      The class follows what the customer received, not which process produced the bytes. A draft
      that was sent is CONVERSATION_BODY (180 days, REDACT); a draft never sent is AGENT_RUN_PAYLOAD
      (90 days). A human's edit takes the same rule — sent is CONVERSATION_BODY, never-sent is
      AGENT_RUN_PAYLOAD. Treating a human's edit as staff work product with a longer rule was
      considered and rejected: it looks like a principled distinction and is in fact a longer-lived
      copy of customer-facing text, which is the DEC-018 failure in a different costume.

      Every uncovered column is named. approval_decisions.note and
      channel_send_receipts.resolution_note are evidence, retained and access-restricted — they are
      the recorded reason a send or a sum of money was approved, and how an ambiguous send outcome
      was settled. contact_channel_bindings.provider_user_ref is retained and access-restricted
      because it is the join key suppression_entries uses; purging it would lose the ability to
      honour a STOP already given. The jsonb payloads on approval_requests, outbox_events and
      domain_events are ledger, retained. command_idempotency_records.response is governed by
      ASSISTANT-RETENTION-001.

      New class STAFF_IDENTITY covers staff_users.display_name and email: retained while the account
      is active, then redacted to a non-identifying staff reference 90 days after deactivation. Audit
      rows bind actor_id, a UUID, not a name, so the audit chain survives the redaction intact —
      which is what makes it safe. Staff are data subjects under Luật 91/2025/QH15 exactly as
      customers are. Deliberately not decided: whether Vietnamese labour or tax law requires a longer
      hold on employment records, which attaches to the shop's personnel records rather than this
      database.
  - id: DEC-020
    title: Which identity may execute a retention purge, and what the database grants it
    status: RESOLVED
    owner: BUSINESS_OWNER
    affected_capabilities: [INTERNAL_SHADOW]
    fail_closed_behavior: NOT_SUPPORTED
    source: docs/DECISION_REQUEST_RETENTION_EXECUTION_2026-08.md
    opened_at: '2026-08-18'
    question: >-
      No GRANT, REVOKE, CREATE ROLE or ROW LEVEL SECURITY statement exists anywhere in migrations
      0001 to 0027, and scripts/apply_demo_grants.py REVOKEs DELETE, TRUNCATE, REFERENCES and
      TRIGGER on all tables from the API and worker roles, with a test pinning that behaviour. A
      purge is a DELETE, so no identity in this system can execute one. SECURITY_RELIABILITY_SPEC_V1
      section 9.4 requires deletion of raw inbox data to be audited AND restricted; the audited half
      is built and the restricted half does not exist. The owner decides which identity purges,
      whether a purge may run unattended at all, and whether the disposable side tables should be
      the only tables in the schema with DELETE granted to anyone.
    blocking_today: >-
      No purge can execute regardless of schedule, which is fail-closed and correct. It also means
      RETENTION-STORE-001 cannot be completed by engineering alone, which is why it is recorded as a
      blocker rather than worked around.
    resolved_at: '2026-09-17'
    decision_record: docs/DECISION_REQUEST_RETENTION_EXECUTION_2026-08.md
    resolution: >-
      Owner ratified the engineering recommendation on record on 2026-09-17 ("I ratify
      DEC-018/019/020").

      A dedicated retention_purge database role executes purges, granted DELETE on exactly the
      disposable side tables and nothing else. Not the API role and not the worker role:
      apply_demo_grants.py deliberately REVOKEs DELETE from both and a test pins it, and that stays.
      The identity that serves customers must not be the identity that can delete their records,
      because a compromise of the API must not be able to erase the evidence of itself.

      A purge may run unattended, but only for classes explicitly listed in SUPPORTED_PURGE_CLASSES,
      and the first run of any newly-enabled class is attended and its output reviewed by a named
      person before that class runs on its own. Requiring a human to start every run means it will
      not happen, and a retention schedule nobody executes is worse than none — it is a written
      promise being quietly broken. Requiring none means the first bug deletes at scale before
      anyone looks. Every run records its actor, its per-class counts, and its held-back exemptions.

      The two disposable side tables are the only tables in the schema with DELETE granted to
      anyone, and the GRANT ships in the same migration that creates the separable store. A
      purgeable table and the permission to purge it are created in one change or they drift, and
      the drift is silent in the direction that matters: a table the schedule promises to purge,
      that no identity may delete from, reports a schedule it cannot honour.
  - id: DEC-021
    title: When a quote becomes final, who may make it so, and how that is recorded
    status: RESOLVED
    owner: BUSINESS_OWNER
    affected_capabilities: [INTERNAL_SHADOW]
    fail_closed_behavior: NOT_SUPPORTED
    source: docs/DECISION_REQUEST_QUOTE_APPROVAL_2026-08.md
    opened_at: '2026-08-21'
    question: >-
      No command path in this system can produce a quote revision that order creation will accept.
      OrderRepository.create requires finality APPROVED_EXACT and status ACCEPTED_FINAL with a
      non-null approval_id (orders.py:126-137); compose_quote_revision hardcodes ESTIMATE,
      REVIEW_REQUIRED and approval_id None on every path (quote_composition.py:232-233, 254-255);
      quotes.py:133 is the sole INSERT and a trigger forbids UPDATE, so a revision must be born
