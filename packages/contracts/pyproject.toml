[project]
name = "nha-trang-laundry-contracts"
version = "0.1.0"
description = "Typed, language-neutral boundary contracts and generated adapters."
requires-python = ">=3.12,<3.14"
dependencies = [
  "cryptography>=48.0.1,<49",
  "jsonschema>=4.25,<5",
  "json5>=0.12,<1",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2,<7",
  "rfc8785>=0.1.4,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
