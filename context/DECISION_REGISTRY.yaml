      condition of taking the customer's laundry.

      Not decided here: what the correct tax treatment is. That stays unverified, is still stamped on
      every revision, and is the accountant's to settle. This decision says only that settling it is
      not a precondition of accepting an order.
  - id: DEC-023
    title: When and how a delivery order is paid for, and who records that it arrived
    status: RESOLVED
    owner: BUSINESS_OWNER
    affected_capabilities: [INTERNAL_SHADOW, DELIVERY_ADVISORY, BOOKING]
    fail_closed_behavior: NOT_SUPPORTED
    source: docs/DECISION_REQUEST_DELIVERY_COMPLETION_2026-08.md
    opened_at: '2026-08-26'
    question: >-
      Measured on 2026-08-26 by running the full lifecycle against the live database for both
      fulfilment modes. Self-collection completes end to end. A delivery order is priced, agreed,
      taken and washed, then stops at two refusals: `settlement shape is not supported`, because
      `evaluate_settlement` accepts only goods handed back at the counter (DEC-010, resolved
      2026-08-18 as deliberately deferred, when delivery was not in view); and
      `INVALID_STATE_TRANSITION: fulfillment is incomplete`, because
      `orders.required_delivery_legs_succeeded` is read in three places, defaults FALSE and is
      written nowhere.

      The two are coupled, which is why they are one decision. Building the delivery-leg writer
      (FULFILMENT-001, decision-clear on DEC-003 since 2026-08-18 and never enqueued) without
      deciding the settlement question ships a delivery order that reaches "delivered, unpaid,
      permanently ACTIVE" -- worse than today, because it looks finished. And the coupling runs both
      ways: whether the driver collects cash decides what a delivery leg must record, so the record
      cannot be designed before the answer. The owner decides when a delivery customer pays, who
      confirms the goods arrived, and what happens when delivery fails.
    blocking_today: >-
      Delivery orders. They can be taken, priced, agreed and worked, and then cannot be settled or
      closed. The walk-in path is unaffected and complete. FULFILMENT-001 stays unenqueued rather
      than being built against a guess.
    resolved_at: '2026-08-26'
    decision_record: docs/DECISION_REQUEST_DELIVERY_COMPLETION_2026-08.md
    resolution: >-
      **Question 1 — owner's choice.** The owner ratified the engineering recommendation on record,
      option A: khách giao hàng trả trước tại quầy. The customer pays the exact quoted total at the
      counter when the laundry is handed over, before it leaves the shop. No driver carries money,
      no cash is reconciled at the end of a day, and the shop is never owed money by somebody
      holding its laundry.

      This adds a second settlement shape, `EXACT_PAYMENT_PREPAID_DELIVERY`, and that is the change
      the code itself asked to be deliberate about: `SettlementShape` carries the comment "An enum
      of one, so adding a second is a visible decision." This entry is that visible decision.

      It reopens nothing. `DEC-010` deferred partial payment, deposits, instalments and ON_ACCOUNT
      credit — all shapes about *amount* or *credit*, none of which this is. Exact payment in full
      is precisely the shape `DEC-010` kept. The refusal that blocked delivery,
      `COLLECTION_WAS_NOT_BY_THE_CUSTOMER`, is attributed in `REFUSAL_DECISIONS` to `DEC-003`, not
      to `DEC-010` — it was always waiting on the delivery work rather than on a money decision.

      **Questions 2 and 3 — engineering consequences, not the owner's words.** Both follow from
      question 1 plus this system's own precedent, and are recorded here as derived so a later
      reader can tell them apart from what was ratified.

      *Who confirms the goods arrived:* a named staff member records it, exactly as settlement,
      quote acceptance and counter tickets are recorded. With payment already taken at the counter,
      a delivery leg carries no money and no financial risk, so it is an ordinary attributed
      attestation. A driver-facing surface — a mobile app, a roadside login, a driver identity —
      is a separate decision nobody has asked for, and no such surface exists.

      *A delivery that fails:* the attempt is recorded as a failed leg, nothing is charged, and the
      order stays `ACTIVE` with the goods back at the shop. A retry is a new leg row rather than an
      edit, because legs are append-only. Charging a second delivery fee automatically would be
      this system deciding money, which it must not; if the shop wants to charge for a second
      attempt, staff negotiate it as they do any fee over 6km under `DEC-003`.

      If either derived answer is wrong about how the shop actually works, it is a correction to
      make, not a decision to re-run.
  - id: DEC-024
    title: How an order leaves the system when the normal path does not apply
    status: RESOLVED
    owner: BUSINESS_OWNER
    affected_capabilities: [INTERNAL_SHADOW, ORDER_STATUS, BOOKING]
    fail_closed_behavior: REQUIRE_HUMAN
    source: docs/DECISION_REQUEST_ORDER_EXIT_2026-08.md
    opened_at: '2026-08-31'
    question: >-
      Two defects in the same family, both measured on 2026-08-31 and both week-one counter events.
      Production `EXCEPTION` has zero outgoing edges: `transition_production` tests
      `current in {RELEASED, EXCEPTION}` before any exit is reachable and discards
      `production_resume_status`, so a paid order interrupted by a stain or a machine fault can
      never reach any terminal state. And `CONFIRMED -> CANCELLED` has no guard at all, while the
      one guarded cancellation path is unreachable because `cancellation_approved` and
      `custody_and_financial_resolution_recorded` default false and no caller ever passes them --
      so the reviewed path always refuses and the unreviewed path always succeeds. An order can be
      cancelled after the laundry is washed and released, with the money never recorded. The owner
      decides whether an exception is resumable, what must be true before a started order may be
      cancelled, whether the customer is refunded, and who hands the goods back.
    blocking_today: >-
      An order that hits a production exception cannot be closed or cancelled by anyone, and a late
      cancellation loses the money silently. `ORDER-EXIT-001` is written and deliberately not
      started; `SHOP-CUTOVER-001` does not proceed while this is open, because both cases occur in
      the first week of real counter operation.
    resolved_at: '2026-09-03'
    decision_record: docs/DECISION_REQUEST_ORDER_EXIT_2026-08.md
    resolution: >-
      Delegated by the owner to the engineer on record on 2026-09-03: "make decision with research
      truth and senior engineer thinking simply answer all the questions and execute". The
      recommendation in the linked packet is therefore the answer rather than a proposal. If any
      part of it is wrong about how the shop actually works, that is a correction to make, not a
      decision to re-run.

      **Production exception: resumable.** An exception is an interruption, not an outcome.
      `DEC-004` already assumes the laundry gets finished -- free rewash within 7 days on store
      fault, compensation capped at 5x the cleaning fee -- so a state machine in which a found stain
      permanently orphans a paid order contradicts the shop's own remedy policy. `EXCEPTION` stores
      the state it interrupted, exactly as `ON_HOLD` does, and may resume to that state or to any
      earlier point in the production sequence: a stain found at quality check needs a rewash, which
      is backward movement, and requiring an attributed exception first is the control on it. An
      exception cannot be raised before production starts, for the same reason a hold cannot --
      nothing has happened to the laundry yet, and that case is a commercial cancellation.

      **Late cancellation: free before work starts, reviewed after.** A direct cancellation is
      permitted only while production is `NOT_STARTED`, intake is not `ACCEPTED`, and nothing has
      been paid -- the customer changing their mind at the counter, which is the common case and
      which staff would work around on paper if it required a review step. Once any of those is
      false the order cancels only through `CANCELLATION_REVIEW`, and `cancellation_approved` and
      `custody_and_financial_resolution_recorded` become real inputs a named staff member sets, as
      an attributed append-only attestation in the same shape `DEC-021` and `DEC-023` chose. One
      person suffices; a shift with one person on duty is a real shift.

      **What the custody flag means**, which is the substance of the decision. One of three:
      `NOT_RECEIVED` (nothing was taken in, so nothing to return and nothing to refund);
      `RETURNED_UNWASHED_REFUNDED` (laundry handed back and any prepayment refunded in full); or
      `SHOP_FAULT_NO_CHARGE` (the goods cannot be returned as received, nothing is charged, and an
      incident opens under `DEC-004`).

      **Refund position: full refund when nothing was washed, no charge when it is the shop's
      fault, and otherwise the order completes rather than cancels.** That last clause is the
      important one and it costs no code. A customer whose laundry has been washed does not cancel
      -- they pay and collect, or the goods stay with the shop. The protection is physical custody,
      which is also why this has never bitten, and the system enforces it by offering no resolution
      code for "washed, walked away, no money".

      The goods are handed back by the staff member at the counter, recorded by name. No
      driver-facing surface exists and none is needed.
  - id: DEC-025
    title: Who is told when the shop's software is in trouble
    status: RESOLVED
    owner: BUSINESS_OWNER
    affected_capabilities: [INTERNAL_SHADOW]
    fail_closed_behavior: NOT_SUPPORTED
    source: docs/DECISION_REQUEST_ALERT_ROUTING_2026-09.md
    opened_at: '2026-09-03'
    question: >-
      `SHOP-OBSERVABILITY-001` built four checks that can genuinely fail on the R1 deployment, and
      nothing carries their result to a person. Every way of delivering one adds a counterparty and
      a credential -- an SMTP account, a messaging bot token, a paging provider -- and R1
      deliberately has none of those. The owner decides which failures warrant waking somebody, at
      what hour, through which account, and whose account it is. Two of the four will not announce
      themselves: a WAL archive gap means the recovery guarantee is silently gone, and a filling
      database volume ends with PostgreSQL refusing writes and the counter unable to take an order.
    blocking_today: >-
      Nothing is blocked. The checks run, exit non-zero for a host scheduler, and emit a structured
      line. What is missing is delivery to a person, so the shop would find out about a full disk
      when it cannot take an order. An alert nobody receives is not an alert.
    resolved_at: '2026-09-03'
    decision_record: docs/DECISION_REQUEST_ALERT_ROUTING_2026-09.md
    resolution: >-
      Delegated by the owner to the engineer on record on 2026-09-03, with the same instruction as
      `DEC-024`.

      **A Telegram bot to the owner's phone, with host cron mail retained as the floor.** Not local
      mail alone: reading it requires connecting to the host, and the two checks that matter -- the
      WAL archive gap and the filling volume -- are precisely the ones nobody goes looking for. Not
      a paging provider: disproportionate for one host and one shop. `DEC-005` already selected
      Telegram for Shadow validation, so this is not a new counterparty in substance.

      Three constraints, and they are what keep this from becoming a capability by accident. A
      **separate** bot from any future customer bot, one hardcoded recipient, and **no inbound
      handler**. The check script posts directly over HTTPS and never through the outbox, the
      channel adapter or the consent machinery -- so this is not an automated send, and
      `FEATURE_AUTOMATED_SENDS_ENABLED` stays false and stays meaningful. And the credential lives
      in `/run/secrets` like every other, never in a repository file.

      **Hours.** The WAL gap, the volume and the capability flags alert at any hour: each is a
      silent loss of a guarantee rather than a visible outage. The console-reachability check alerts
      only between 07:00 and 21:00 -- a console down at 03:00 that is back before opening does not
      matter, and one down at 07:45 matters enormously.

      Recipient: the owner, who is the person who would fix any of the four. Not the counter staff,
      who cannot act on a full disk.
  - id: DEC-026
    title: Who holds the key that can read the shop's backups
    status: RESOLVED
    owner: BUSINESS_OWNER
    affected_capabilities: [INTERNAL_SHADOW]
    fail_closed_behavior: NOT_SUPPORTED
    source: docs/DECISION_REQUEST_BACKUP_KEY_CUSTODY_2026-09.md
    opened_at: '2026-09-03'
    question: >-
      ADR-0007 §3 requires the archive to be encrypted before it leaves the host "with a key that is
      not stored on Host A". Taken literally that excludes a passphrase, because a value present to
      write the archive also decrypts every archive ever taken -- the exact failure the requirement
      exists to exclude. So the archiving encrypts to a recipient public key and the identity that
      can read lives elsewhere. The owner decides who physically holds it, where the second copy
      lives, who may authorise its use in a restore, and acknowledges that losing it makes every
      backup permanently unrecoverable -- not difficult, impossible, with no vendor to call and no
      copy on the server by design.
    blocking_today: >-
      Archiving is built and not enabled: `archive_command`, the base-backup sidecar and the restore
      script all exist, and none can run without a recipient key. `BACKUP-RESTORE-001` completes on
      a drill result rather than on configuration, and the drill needs the identity this decision
      places. Deferring means the deployment runs with no recovery at all.
    resolved_at: '2026-09-03'
    decision_record: docs/DECISION_REQUEST_BACKUP_KEY_CUSTODY_2026-09.md
    resolution: >-
      Delegated by the owner to the engineer on record on 2026-09-03, with the same instruction as
      `DEC-024`.

      **The owner's zero-knowledge password manager as the primary, plus one offline copy stored
      physically away from both the shop and the server.** This departs from the packet's own
      recommendation, deliberately.

      The packet's objection to a password manager was that the vendor could in principle read the
      shop's history. For a zero-knowledge manager that is overstated: it holds ciphertext under the
      owner's own master key. Meanwhile the failure mode of "the owner holds it, second copy in a
      sealed envelope" is **total and irreversible** -- envelope discipline decays, and this is a
      one-person operations team, so a dead laptop plus an envelope in the same building as the
      server loses every backup forever.

      What decides it is what the archive actually contains: order financial records and staff
      identity. **No customer personal data at all** -- no address column exists in any migration, a
      walk-in is a counter ticket under `DEC-013`, there is no customer-record layer under
      `DEC-015`, and with no channel connected there are no message bodies. So the counterparty
      exposure is low-stakes and the irreversible-loss risk is high-stakes. Optimise against loss.

      Holder: the owner. Restore authoriser: the owner. Loss is acknowledged as final -- there is no
      vendor to call and no copy on the server, by design.

      The key pair is generated on the owner's own device, never on the host and never by an agent.
      The public half becomes the `r1_backup_encryption_recipients` secret; the private half never
      touches the host, this repository, or CI.
  - id: DEC-027
    title: What the first production release contains, and what it deliberately leaves out
    status: RESOLVED
    owner: BUSINESS_OWNER
    affected_capabilities: [INTERNAL_SHADOW]
    fail_closed_behavior: NOT_SUPPORTED
    source: context/tasks/TASK-shop-cutover-001.md
    opened_at: '2026-08-31'
    question: >-
      Whether the first production deployment carries the AI, or only the deterministic staff
      console. The distinction is not a preference: `delivery/GATE_REGISTRY.yaml` and the release
      gate schema require, for even the lowest AI stage, a manifest signed by three distinct actors,
      and the next stage additionally requires fourteen shadow days, one hundred representative
      interactions and thirty completed real orders. Those orders can only come from operating the
      shop, so the deterministic console is not an alternative to the AI ladder -- it is its first
      rung.
    resolved_at: '2026-08-31'
    decision_record: context/tasks/TASK-shop-cutover-001.md
    resolution: >-
      R1 is the deterministic staff console running one real shop: Zone C only, one host, no public
      ingress, no channel, no model. All thirteen capabilities read NOT_AUTHORIZED on day one, which
      is the expected production state rather than a gap, and all five feature flags ship false --
      `WorkerSettings` raises if any is true, so deploying the code cannot enable a capability.

      ADR-0007 §1 permits the shape and gives the reason: Zone P and Zone A exist to process
      untrusted language, and "if cost forces one host, the correct response is to delay public
      ingress, not to collapse the boundary." R1 has no untrusted language to process.

      Deliberately out of scope, each with the decision that keeps it out rather than an omission:
      the model provider posture (`DEC-006`), the inbound channel and who staffs it (`DEC-016`), the
      market-facing name (`DEC-017`), and retention purge execution (`DEC-018`, `DEC-019`,
      `DEC-020`) -- which R1 does not reach, because it stores no customer personal data at all: no
      address column exists in any migration, a walk-in is a counter ticket under `DEC-013`, there
      is no customer-record layer under `DEC-015`, and with no channel there are no webhook
      payloads, conversation bodies or agent drafts. The one class that accumulates is the order
      financial record, whose schedule is ten years.

      What R1 still needs from the owner is recorded as its own decisions: `DEC-024` order exit,
      `DEC-025` alert routing, `DEC-026` backup key custody, and the hosting selection tracked as
      `DECISION-HOSTING-001`.
  - id: DEC-028
    title: How a staff member opens an incident at the counter
    status: RESOLVED
    owner: PRODUCT_ENGINEERING_OWNER
    affected_capabilities: [INTERNAL_SHADOW, INCIDENT_RECEIPT]
    fail_closed_behavior: REQUIRE_HUMAN
    source: docs/DECISION_REQUEST_INCIDENT_INTAKE_2026-09.md
    opened_at: '2026-09-10'
    question: >-
      POST /internal/v1/stores/{store_id}/incidents requires contact_scope_hash and
      evidence_summary_hash and nothing in this repository produces either value, so a staff member
      facing a customer whose shirt came back stained cannot complete the form. Both fields are
      agent-pipeline concepts the staff console inherited by calling the same command. The two
      questions are what a staff-opened incident's contact scope is, and where the evidence summary
      lives.
    blocking_today: >-
      Nothing. The console states on #/incidents that the form cannot be completed and why, #/gaps
      carries the entry, and a test asserts the no-producer claim. The shop records complaints on
      paper against the ticket number.
    resolved_at: '2026-09-18'
    decision_record: docs/DECISION_REQUEST_INCIDENT_INTAKE_2026-09.md
    decided_under: >-
      Delegated engineering authority, not an owner ratification, and recorded as such so the
      registry stays true. The business owner wrote on 2026-09-18: "you are founder and lead
      engineer and you have all business thinking and research and full authorities and permissions
      as long as the decisions best for our app running correctly don't force me to make any
      decision anymore". The request itself asked for a deliberate ruling rather than a side effect
      of a screen change, and this is that ruling. It commits no money, accepts no terms, asserts no
      legal basis and names no person, which is the boundary this delegation does not move.
    resolution: >-
      Question one, the contact scope: answer A, derived by the server from the order the incident
      names. The route already requires an order, so orders.bound_contact_id is defined for every
      incident the console can open, and DEC-013 already decided that for a walk-in the counter
      ticket IS the customer and no name, phone or address is stored. So this invents no convention;
      it applies the one DEC-013 set. contact_scope_hash is removed from the staff request model
      entirely, because invariant 9 puts server-derived contact binding outside client control and a
      staff member must not be able to name a scope for a customer of their choosing.

      Question two, the evidence summary: answer B, stored, in a disposable payload side table.
      Answer A, hashing text that is then discarded, proves only that a string nobody can read did
      not change, and leaves the owner making a DEC-004 remedy decision with nothing to read. Answer
      C records a complaint with no description, which is a tally mark. The objection to B was that
      it brings a new personal-data class into scope and so needs a retention answer alongside
      DEC-008. That objection was correct on 2026-09-10 and is spent: DEC-008 already schedules
      INCIDENT_EVIDENCE at 365 days PURGE, and RETENTION-STORE-001 shipped the mechanism that
      executes such a schedule on 2026-09-17. The summary therefore lives in
      customer_incident_evidence, keyed to the incident, immutable while it exists and deletable by
      the retention_purge role alone, and INCIDENT_EVIDENCE enters SUPPORTED_PURGE_CLASSES with a
      tested purge. The hash on the append-only incident row is computed by the server over the text
      that was actually stored, so it commits to what was kept rather than to something thrown away.

      Consequence worth stating: this makes INCIDENT_EVIDENCE the second disposable side table, which
      is what DEC-020's resolution assumed when it wrote "the two disposable side tables". That
      sentence was reported as a discrepancy against RETENTION-STORE-001, where DEC-018 permitted
      only one; it resolves here rather than by inventing a table to match a count.

      Also settled, because it is the same question: opening an incident sets orders.incident_open,
      which exists in the schema and which no code has ever set, in the same atomic envelope. DEC-024's
      SHOP_FAULT_NO_CHARGE exit is the case that column was added for.

      Implemented by INCIDENT-INTAKE-001.
  - id: DEC-029
    title: Who may choose the exact price inside a published price band
    status: RESOLVED
    owner: BUSINESS_OWNER
    affected_capabilities: [INTERNAL_SHADOW, QUOTE_ESTIMATE]
    fail_closed_behavior: REQUIRE_HUMAN
    source: docs/DECISION_REQUEST_RANGE_PRICE_AUTHORITY_2026-09.md
    opened_at: '2026-09-18'
    question: >-
      20 of the 44 published services are price ranges. SET_RANGE_PRICE required OWNER_ADMIN with
      MFA inside a ten-minute window per garment, so a range-priced item could not be sold on the
      machine whenever the owner was away.
    resolved_at: '2026-09-25'
    decision_record: docs/DECISION_RECORD_FOUNDER_2026-09-25.md
    decided_under: >-
      Delegated authority, not an owner ratification, recorded as such so the registry stays true.
      The business owner wrote on 2026-09-25: "continue with the remaining follow-up items and make
      decisions as real founder of the business and lead engineer", extending the delegation
      recorded under DEC-028. Boundary kept: where no ratified figure exists, the ruling routes
      money to the owner's approval rather than letting it move by rule.
    resolution: >-
      Option B. The staff member on duty chooses inside the band the owner published, under the
      counter attestation DEC-021 uses: attributed, immutable, no MFA, owner-reviewable. The server
      refuses any figure outside the band. Reverse by mapping SET_RANGE_PRICE back to
      _OWNER_FINANCIAL; upgrade to a threshold (option C) if owner review shows careless pricing.
  - id: DEC-030
    title: When a remedy credit and a non-stacking promotion meet on one order
