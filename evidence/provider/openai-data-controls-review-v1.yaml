documented_observations:
  - API data is not used to train OpenAI models by default unless the organization explicitly opts in.
  - Default abuse-monitoring logs may retain customer content for up to 30 days.
  - Responses application state and Zero Data Retention behavior depend on account approval and request features.
  - OpenClaw 2026.7.1-2 documents that direct OpenAI Responses models force store:true unless model compatibility sets supportsStore:false.
  - Disabling OpenClaw responsesServerCompaction controls context-management injection only and does not prove store:false.
