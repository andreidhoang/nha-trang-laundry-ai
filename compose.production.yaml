name: nha-trang-laundry-private-staging

# Bounded json-file logs for every service (`OPS-HARDENING-002`); see compose.yaml for the figures.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# `OPS-OBSERVABILITY-009` / `PLATFORM-RESIDUAL-009B` L4. The API's log is the source
# `check_shop_operations.py --check app` reads and the only record of what the application did. It
# used to live only in Docker's json-file log, which is **deleted with the container** -- and
# `docker compose up` recreates the API container on every image update, so each deploy erased the
# fourteen days. So the API also appends its structured lines to a file on a host directory
# (`STRUCTURED_LOG_FILE`, bind-mounted below), rotated by size inside the process
# (`nha_trang_laundry_observability.logging_setup`: 2 MiB x 49 rotated files + the live one, so
# 100 MiB at most). A host directory rather than the shop's journald: the shop's till is a Mac
# (Docker in a VM, no host journal), staging mirrors it, and a directory is something the host-side
# check reads without Docker at all -- including when the API container is gone, which is when
# somebody most needs to read it. A busy day, in the file's own bytes
# (`test_ops_hardening_contract.py` computes every figure here):
#   100 orders x 73 API lines (the daily walk: 506 lines for 7 orders)    7,300 lines
#   three consoles polling once a minute for 14 hours                     2,520 lines
#     -- all 9,820 costed at 481 bytes, the longest line any route can write
#   the console check's `/readyz` every 5 minutes                 288 lines at 328 bytes
#   the image's own HEALTHCHECK, `/healthz` every 30 s, day and night  2,880 lines at 329 bytes
#   = 5,765,404 bytes a day; fourteen days = 80,715,656 bytes.
# A rotation happens before the line that would pass 2 MiB, so every rotated file holds at least
# 2 MiB minus one line, and the guaranteed history is 49 x (2,097,152 - 481) = 102,736,879 bytes =
# 17.8 busy days. Docker's json-file log for the API is back to the default three 10 MiB files: a
# live view for `docker compose logs`, not the record.

x-runtime-hardening: &runtime-hardening
  logging: *default-logging
  init: true
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
  pids_limit: 128
  restart: unless-stopped
  stop_grace_period: 20s

x-disabled-capabilities: &disabled-capabilities
  FEATURE_PUBLIC_CHANNELS_ENABLED: "false"
  FEATURE_AUTOMATED_SENDS_ENABLED: "false"
  FEATURE_AGENT_RUNTIME_ENABLED: "false"

services:
  # Development convenience only. Private staging uses an externally managed PostgreSQL endpoint
  # reachable solely through the pre-provisioned database-private Docker network.
  postgres:
    profiles: ["local-database"]
    # `!reset`, not `[]`. An overlay's empty list *appends* nothing to compose.yaml's list, so
    # `ports: []` here left the development superuser published by the file below
    # (`OPS-HARDENING-002`); `compose.demo.yaml` had already found and fixed the same trap.
    ports: !reset []
    logging: *default-logging
    networks: [database-private]

  migrate:
    logging: *default-logging
    image: ${STAGING_API_IMAGE:-nha-trang-laundry-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    entrypoint: ["python", "-m", "nha_trang_laundry_db.migration_job"]
    command: []
    init: true
    user: "10003:10003"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    pids_limit: 32
    restart: "no"
    secrets:
      - source: staging_migration_database_url
        target: database_url
        uid: "10003"
        gid: "10003"
        mode: 0400
    networks: [database-private]

  api:
    <<: *runtime-hardening
    image: ${STAGING_API_IMAGE:-nha-trang-laundry-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    user: "10001:10001"
    environment:
      <<: *disabled-capabilities
      STAFF_ALLOWED_ORIGINS: "https://staging.internal:8443"
      API_TRUSTED_HOSTS: "staging.internal,api,localhost,127.0.0.1"
      STRUCTURED_LOG_FILE: /var/log/laundry/api.jsonl
    volumes:
      # Created for uid 10001 before the first start: `sudo install -d -o 10001 -g 10001 -m 0755`.
      - type: bind
        source: ${STAGING_API_LOG_DIRECTORY:-./.staging/logs/api}
        target: /var/log/laundry
    secrets:
      - source: staging_api_database_url
        target: database_url
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: staging_oidc_issuer
        target: oidc_issuer
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: staging_oidc_audience
        target: oidc_audience
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: staging_oidc_jwks_url
        target: oidc_jwks_url
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: staging_oidc_mfa_claim
        target: oidc_mfa_claim
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: staging_oidc_mfa_value
        target: oidc_mfa_value
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: staging_hash_key
        target: hash_key
        uid: "10001"
        gid: "10001"
        mode: 0400
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [ingress-private, database-private]

  worker:
    <<: *runtime-hardening
    image: ${STAGING_WORKER_IMAGE:-nha-trang-laundry-worker:local}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    user: "10002:10002"
    environment:
      <<: *disabled-capabilities
      WORKER_INTERNAL_OUTBOX_ENABLED: "false"
      WORKER_AGENT_QUEUE_ENABLED: "false"
    secrets:
      - source: staging_worker_database_url
        target: database_url
        uid: "10002"
        gid: "10002"
        mode: 0400
      # No hash key (PLATFORM-SECURITY-009 P1). No worker path computes a keyed digest -- the
      # inbox and the idempotency records are written by the API -- and this is the process that
      # will host the model runtime, so it must not hold the key that unseals every phone.
      # `apps/worker/tests/test_worker_least_privilege.py` runs every worker path with no key.
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [database-private]

  tls:
    <<: *runtime-hardening
    image: ${STAGING_TLS_IMAGE:-nha-trang-laundry-tls:local}
    build:
      context: .
      dockerfile: deploy/staging/Caddy.Dockerfile
    user: "10004:10004"
    entrypoint: ["caddy"]
    command: ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - name: private-operator-https
        target: 8443
        published: "8443"
        host_ip: 127.0.0.1
        protocol: tcp
    configs:
      - source: staging_caddyfile
        target: /etc/caddy/Caddyfile
        uid: "10004"
        gid: "10004"
        mode: 0440
    secrets:
      - source: staging_tls_certificate
        target: tls_certificate
        uid: "10004"
        gid: "10004"
        mode: 0400
      - source: staging_tls_private_key
        target: tls_private_key
        uid: "10004"
        gid: "10004"
        mode: 0400
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
      - /config:rw,noexec,nosuid,nodev,size=4m,mode=0700,uid=10004,gid=10004
      - /data:rw,noexec,nosuid,nodev,size=4m,mode=0700,uid=10004,gid=10004
    depends_on:
      api:
        condition: service_healthy
    networks:
      ingress-private:
        aliases: [staging.internal]

configs:
  staging_caddyfile:
    file: deploy/staging/Caddyfile

secrets:
  staging_migration_database_url:
    external: true
  staging_api_database_url:
    external: true
  staging_worker_database_url:
    external: true
  staging_oidc_issuer:
    external: true
  staging_oidc_audience:
    external: true
  staging_oidc_jwks_url:
    external: true
  staging_oidc_mfa_claim:
    external: true
  staging_oidc_mfa_value:
    external: true
  # HASH-KEYING-001. The API writes keyed commitments -- the inbox writes `payload_hash`, and
  # every idempotent command writes `request_hash` -- and refuses the write without it rather
  # than falling back to an unkeyed digest. Mounted into the API only: the worker computes no
  # keyed digest and must not hold the key (PLATFORM-SECURITY-009 P1).
  staging_hash_key:
    external: true
  staging_tls_certificate:
    external: true
  staging_tls_private_key:
    external: true

networks:
  ingress-private:
    internal: true
    driver: bridge
  database-private:
    external: true
    name: ${STAGING_DATABASE_NETWORK:-nha-trang-laundry-staging-database-private}
