name: release-supply-chain

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  RELEASE_COMMIT_SHA: ${{ github.sha }}
  OPENCLAW_R2: openclaw-2026.7.1-2-nha-trang-r2.tgz
  OPENCLAW_MANIFEST: runtime/openclaw/repack/manifest-v2.json

jobs:
  openclaw-repackage-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          python-version: "3.12.13"
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: runtime/openclaw/public-cell/plugin/package-lock.json
      - name: Build and independently verify Windows r2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          uv sync --all-packages --all-groups --frozen
          npm ci --prefix runtime/openclaw/public-cell/plugin --ignore-scripts
          uv run python scripts/build_openclaw_repackage.py --verify-reproducible
          uv run python scripts/verify_openclaw_repackage.py
          New-Item -ItemType Directory -Force artifacts/supply-chain | Out-Null
          uv run python scripts/verify_openclaw_cross_platform.py emit `
            --artifact "runtime/openclaw/repack/dist/$env:OPENCLAW_R2" `
            --manifest $env:OPENCLAW_MANIFEST `
            --commit-sha $env:RELEASE_COMMIT_SHA `
            --runner-os $env:RUNNER_OS `
            --runner-arch $env:RUNNER_ARCH `
            --runner-name $env:RUNNER_NAME `
            --runner-image $env:ImageOS `
            --runner-image-version $env:ImageVersion `
            --output artifacts/supply-chain/openclaw-r2-windows.json
      - name: Upload Windows r2 result
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-r2-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            runtime/openclaw/repack/dist/openclaw-2026.7.1-2-nha-trang-r2.tgz
            artifacts/supply-chain/openclaw-r2-windows.json

  openclaw-repackage-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          python-version: "3.12.13"
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: runtime/openclaw/public-cell/plugin/package-lock.json
      - name: Build and independently verify Linux r2
        shell: bash
        run: |
          set -euo pipefail
          uv sync --all-packages --all-groups --frozen
          npm ci --prefix runtime/openclaw/public-cell/plugin --ignore-scripts
          uv run python scripts/build_openclaw_repackage.py --verify-reproducible
          uv run python scripts/verify_openclaw_repackage.py
          mkdir -p artifacts/supply-chain
          uv run python scripts/verify_openclaw_cross_platform.py emit \
            --artifact "runtime/openclaw/repack/dist/$OPENCLAW_R2" \
            --manifest "$OPENCLAW_MANIFEST" \
            --commit-sha "$RELEASE_COMMIT_SHA" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH" \
            --runner-name "$RUNNER_NAME" \
            --runner-image "$ImageOS" \
            --runner-image-version "$ImageVersion" \
            --output artifacts/supply-chain/openclaw-r2-linux.json
      - name: Upload Linux r2 result
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-r2-linux-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            runtime/openclaw/repack/dist/openclaw-2026.7.1-2-nha-trang-r2.tgz
            artifacts/supply-chain/openclaw-r2-linux.json

  openclaw-cross-platform-compare:
    runs-on: ubuntu-latest
    needs: [openclaw-repackage-windows, openclaw-repackage-linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          python-version: "3.12.13"
          enable-cache: false
      - name: Download Windows r2
        uses: actions/download-artifact@v4
        with:
          name: openclaw-r2-windows-${{ github.sha }}
          path: ${{ runner.temp }}/openclaw-r2-windows
      - name: Download Linux r2
        uses: actions/download-artifact@v4
        with:
          name: openclaw-r2-linux-${{ github.sha }}
          path: ${{ runner.temp }}/openclaw-r2-linux
      - name: Compare exact bytes and manifest-bound metadata
        shell: bash
        run: |
          set -euo pipefail
          uv sync --all-packages --all-groups --frozen
          windows_root="$RUNNER_TEMP/openclaw-r2-windows"
          linux_root="$RUNNER_TEMP/openclaw-r2-linux"
          compared_root="$RUNNER_TEMP/openclaw-r2-compared"
          mkdir -p "$compared_root"
          uv run python scripts/verify_openclaw_cross_platform.py compare \
            --windows-result "$windows_root/artifacts/supply-chain/openclaw-r2-windows.json" \
            --windows-artifact "$windows_root/runtime/openclaw/repack/dist/$OPENCLAW_R2" \
            --linux-result "$linux_root/artifacts/supply-chain/openclaw-r2-linux.json" \
            --linux-artifact "$linux_root/runtime/openclaw/repack/dist/$OPENCLAW_R2" \
            --manifest "$OPENCLAW_MANIFEST" \
            --expected-commit "$RELEASE_COMMIT_SHA" \
            --output-result "$compared_root/openclaw-cross-platform-comparison.json" \
            --output-artifact "$compared_root/$OPENCLAW_R2"
      - name: Upload compared r2
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-r2-compared-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/openclaw-r2-compared/openclaw-2026.7.1-2-nha-trang-r2.tgz
            ${{ runner.temp }}/openclaw-r2-compared/openclaw-cross-platform-comparison.json

  supply-chain:
    runs-on: ubuntu-latest
    needs: [openclaw-cross-platform-compare]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          python-version: "3.12.13"
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: runtime/openclaw/public-cell/plugin/package-lock.json
      - name: Download compared r2
        uses: actions/download-artifact@v4
        with:
          name: openclaw-r2-compared-${{ github.sha }}
          path: ${{ runner.temp }}/openclaw-r2-compared
      - name: Install locked workspace
        run: uv sync --all-packages --all-groups --frozen
      - name: Bind compared r2 to the OCI build context
        shell: bash
        run: |
          set -euo pipefail
          compared_root="$RUNNER_TEMP/openclaw-r2-compared"
          compared_artifact="$compared_root/$OPENCLAW_R2"
          comparison="$compared_root/openclaw-cross-platform-comparison.json"
          committed_artifact="runtime/openclaw/repack/dist/$OPENCLAW_R2"
          uv run python scripts/verify_openclaw_cross_platform.py verify \
            --comparison "$comparison" \
            --artifact "$compared_artifact" \
            --manifest "$OPENCLAW_MANIFEST" \
            --expected-commit "$RELEASE_COMMIT_SHA"
          cmp --silent "$compared_artifact" "$committed_artifact"
          install -m 0644 "$compared_artifact" "$committed_artifact"
          mkdir -p artifacts/supply-chain
          cp "$comparison" artifacts/supply-chain/openclaw-cross-platform-comparison.json
          uv run python scripts/verify_openclaw_repackage.py
          npm ci --prefix runtime/openclaw/public-cell/plugin --ignore-scripts
          npm --prefix runtime/openclaw/public-cell/plugin run build
          uv run python scripts/verify_agent_runtime.py \
            > artifacts/supply-chain/openclaw-runtime-audit.json
      - name: Scan committed content locally with gitleaks
        run: |
          mkdir -p artifacts/supply-chain
          docker run --rm --volume "$PWD:/repo:ro" \
            --volume "$PWD/artifacts/supply-chain:/out" \
            ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --exit-code 1 \
            --report-format json --report-path /out/gitleaks.json
      - name: Audit Python dependencies from uv.lock
        run: |
          uv export --frozen --all-packages --no-dev --no-emit-workspace \
            --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit==2.9.0 pip-audit --requirement "$RUNNER_TEMP/requirements.txt" \
            --format json --output artifacts/supply-chain/pip-audit.json
      - name: Audit Node dependencies from package-lock.json
        run: >-
          npm audit --prefix runtime/openclaw/public-cell/plugin --audit-level=high
          --json > artifacts/supply-chain/npm-audit.json
      - name: Audit dependency licenses
        run: >-
          uv run python scripts/audit_dependency_licenses.py
          --package-lock runtime/openclaw/public-cell/plugin/package-lock.json
          --output artifacts/supply-chain/licenses.json
      - name: Build exact images and create SBOM/scan evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/supply-chain
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          trivy_image="aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f"
          trivy_version="$(docker run --rm "$trivy_image" --version | sed -n 's/^Version: //p' | head -1)"
          test "$trivy_version" = "0.72.0"
          for service in api worker public-agent-tools; do
            tag="nha-trang-laundry-${service}:candidate"
            docker build --pull=false --file "apps/${service}/Dockerfile" --tag "$tag" .
            archive="$RUNNER_TEMP/${service}.tar"
            docker save "$tag" --output "$archive"
            docker run --rm \
              --volume "$RUNNER_TEMP:/work:ro" \
              --volume "$PWD/artifacts/supply-chain:/out" \
              --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              "$trivy_image" image --input "/work/${service}.tar" --scanners vuln \
              --format cyclonedx --output "/out/${service}.cdx.json"
            docker run --rm \
              --volume "$RUNNER_TEMP:/work:ro" \
              --volume "$PWD/artifacts/supply-chain:/out" \
              --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              "$trivy_image" image --input "/work/${service}.tar" --scanners vuln \
              --format sarif --severity CRITICAL,HIGH --exit-code 1 \
              --output "/out/${service}.sarif"
            image_id="$(jq -er '.runs[0].properties.imageID | select(test("^sha256:[0-9a-f]{64}$"))' \
              "artifacts/supply-chain/${service}.sarif")"
            image_ref="nha-trang-laundry-${service}@${image_id}"
            uv run python scripts/normalize_container_scan.py \
              --sarif "artifacts/supply-chain/${service}.sarif" \
              --sbom "artifacts/supply-chain/${service}.cdx.json" \
              --sbom-uri "artifacts/supply-chain/${service}.cdx.json" \
              --image-ref "$image_ref" --scanner trivy --scanner-version "$trivy_version" \
              --evidence-id "SCAN:${service^^}:${GITHUB_RUN_ID}" \
              --output "artifacts/supply-chain/${service}-scan.json"
            printf '%s=%s\n' "$image_ref" "artifacts/supply-chain/${service}-scan.json" \
              >> artifacts/supply-chain/image-bindings.txt
          done
          openclaw_archive="$RUNNER_TEMP/openclaw.oci.tar"
          docker buildx create --driver docker-container \
            --name "supply-chain-${GITHUB_RUN_ID}" --use
          docker buildx inspect --bootstrap | tee "$RUNNER_TEMP/supply-chain-buildx.txt"
          grep -Eq '^Driver:[[:space:]]+docker-container$' \
            "$RUNNER_TEMP/supply-chain-buildx.txt"
          docker buildx build --pull=false --platform linux/amd64 \
            --file runtime/openclaw/repack/Dockerfile \
            --provenance=mode=max --sbom=true \
            --output "type=oci,dest=${openclaw_archive}" .
          uv run python scripts/verify_openclaw_oci_attestations.py \
            --oci-archive "$openclaw_archive" \
            --output artifacts/supply-chain/openclaw-provenance.json
          openclaw_oci_dir="$RUNNER_TEMP/openclaw-oci"
          mkdir -p "$openclaw_oci_dir"
          tar -xf "$openclaw_archive" -C "$openclaw_oci_dir"
          openclaw_config_digest="$(jq -er \
            'select(.predicate_type == "https://slsa.dev/provenance/v1") \
              | .config_digest | select(test("^sha256:[0-9a-f]{64}$"))' \
            artifacts/supply-chain/openclaw-provenance.json)"
          docker run --rm \
            --volume "$RUNNER_TEMP:/work:ro" \
            --volume "$PWD/artifacts/supply-chain:/out" \
            --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$trivy_image" image --input /work/openclaw-oci --scanners vuln \
            --format cyclonedx --output /out/openclaw.cdx.json
          docker run --rm \
            --volume "$RUNNER_TEMP:/work:ro" \
            --volume "$PWD/artifacts/supply-chain:/out" \
            --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$trivy_image" image --input /work/openclaw-oci --scanners vuln \
            --format sarif --severity CRITICAL,HIGH --exit-code 1 \
            --output /out/openclaw.sarif
          openclaw_scan_digest="$(jq -er \
            '.runs[0].properties.imageID | select(test("^sha256:[0-9a-f]{64}$"))' \
            artifacts/supply-chain/openclaw.sarif)"
          # Trivy's OCI archive imageID is the config digest. The provenance verifier above
          # proves that exact config is referenced by the attested linux/amd64 manifest.
          test "$openclaw_scan_digest" = "$openclaw_config_digest"
          openclaw_ref="nha-trang-laundry-openclaw@${openclaw_config_digest}"
          uv run python scripts/normalize_container_scan.py \
            --sarif artifacts/supply-chain/openclaw.sarif \
            --sbom artifacts/supply-chain/openclaw.cdx.json \
            --sbom-uri artifacts/supply-chain/openclaw.cdx.json \
            --image-ref "$openclaw_ref" --scanner trivy --scanner-version "$trivy_version" \
            --evidence-id "SCAN:OPENCLAW:${GITHUB_RUN_ID}" \
            --output artifacts/supply-chain/openclaw-scan.json
          printf '%s=%s\n' "$openclaw_ref" artifacts/supply-chain/openclaw-scan.json \
            >> artifacts/supply-chain/image-bindings.txt
      - name: Assemble and independently verify release evidence
        shell: bash
        run: |
          set -euo pipefail
          image_args=()
          while IFS= read -r binding; do image_args+=(--image "$binding"); done \
            < artifacts/supply-chain/image-bindings.txt
          uv run python scripts/assemble_supply_chain_evidence.py \
            --artifact-root . --commit-sha "$RELEASE_COMMIT_SHA" \
            --secret-scanner-version 8.28.0 \
            --dependency-scanner-version pip-audit-2.9.0+npm-audit+openclaw-audit+reproducibility+slsa-v1 \
            --license-scanner-version policy-v1 \
            --lockfile uv.lock \
            --lockfile runtime/openclaw/public-cell/plugin/package-lock.json \
            --secret-report artifacts/supply-chain/gitleaks.json \
            --dependency-report artifacts/supply-chain/pip-audit.json \
            --dependency-report artifacts/supply-chain/npm-audit.json \
            --dependency-report artifacts/supply-chain/openclaw-runtime-audit.json \
            --dependency-report artifacts/supply-chain/openclaw-cross-platform-comparison.json \
            --dependency-report artifacts/supply-chain/openclaw-provenance.json \
            --license-report artifacts/supply-chain/licenses.json \
            "${image_args[@]}" --evidence-id "SUPPLY:${GITHUB_RUN_ID}" \
            --output artifacts/supply-chain/evidence.json
          uv run python scripts/verify_supply_chain_evidence.py \
            --evidence artifacts/supply-chain/evidence.json \
            --expected-commit-sha "$RELEASE_COMMIT_SHA"
      - name: Upload sanitized engineering evidence
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/supply-chain/*.cdx.json
            artifacts/supply-chain/*-scan.json
            artifacts/supply-chain/evidence.json
            artifacts/supply-chain/licenses.json
            artifacts/supply-chain/gitleaks.json
            artifacts/supply-chain/pip-audit.json
            artifacts/supply-chain/npm-audit.json
            artifacts/supply-chain/openclaw-runtime-audit.json
            artifacts/supply-chain/openclaw-cross-platform-comparison.json
            artifacts/supply-chain/openclaw-provenance.json
