openapi: 3.1.0
info:
  title: Nha Trang Laundry internal API
  version: v1
  description: 'Generated from the built FastAPI application by scripts/generate_internal_api_contract.py.
    It covers EVERY served operation, including those FastAPI excludes from its own schema via include_in_schema=False
    - on this application that is five operations, three of them the authentication surface. Do not hand-edit:
    scripts/verify_contracts.py regenerates this document and fails on any difference, which is what keeps
    a new route from landing without a contract entry. Non-operation entries the application serves -
    today only the /staff static mount - are listed under x-served-mounts rather than omitted; an unrecognized
    route type is a hard generation failure, not a silent skip.'
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Return only process health; /readyz is the one that asks the database.
      x-authorization-dependencies: []
      x-documented-by-fastapi: false
      responses:
        '200':
          description: Success response.
  /internal/v1/approvals:
    get:
      operationId: list_pending_approvals
      summary: list_pending_approvals
      x-authorization-dependencies:
      - require_approval_staff
      - get_operations_service
      x-documented-by-fastapi: true
      responses:
        '200':
          description: Success response.
    post:
      operationId: request_approval
      summary: request_approval
      x-authorization-dependencies:
      - require_operations_staff
      - get_operations_service
      x-documented-by-fastapi: true
      responses:
        '201':
          description: Success response.
  /internal/v1/approvals/{approval_id}/decisions:
    post:
      operationId: decide_approval
      summary: decide_approval
      x-authorization-dependencies:
      - require_approval_staff
      - get_operations_service
      x-documented-by-fastapi: true
      responses:
        '200':
          description: Success response.
      parameters:
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
  /internal/v1/approvals/{approval_id}/export-request:
    get:
      operationId: read_export_request_for_approval
      summary: What one `EXPORT_SANITIZED_DATA` envelope releases, for the person being asked to sign
        it.
      x-authorization-dependencies:
      - require_approval_staff
      - get_ops_board_service
      x-documented-by-fastapi: true
      responses:
        '200':
          description: Success response.
      parameters:
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
  /internal/v1/approvals/{approval_id}/manual-send:
    post:
      operationId: prepare_manual_send
      summary: prepare_manual_send
      x-authorization-dependencies:
      - require_operations_staff
      - get_operations_service
      x-documented-by-fastapi: true
      responses:
        '201':
          description: Success response.
      parameters:
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
  /internal/v1/approvals/{approval_id}/range-price-proposal:
    get:
      operationId: read_range_price_proposal
      summary: The amounts behind one `SET_RANGE_PRICE` envelope, for the person being asked to sign it.
      x-authorization-dependencies:
      - require_approval_staff
      - get_operations_service
      x-documented-by-fastapi: true
      responses:
        '200':
          description: Success response.
      parameters:
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
  /internal/v1/auth/logout:
    post:
      operationId: logout
      summary: End the application session, and tell the console where to end the issuer's.
      x-authorization-dependencies:
      - current_principal
      - get_identity_service
      x-documented-by-fastapi: false
      responses:
        '200':
          description: Success response.
  /internal/v1/auth/session:
    post:
      operationId: exchange_identity_token
      summary: exchange_identity_token
      x-authorization-dependencies:
      - get_identity_service
      x-documented-by-fastapi: false
      responses:
        '200':
          description: Success response.
  /internal/v1/manual-sends/{manual_send_id}/attest:
    post:
      operationId: attest_manual_send
      summary: attest_manual_send
      x-authorization-dependencies:
      - require_operations_staff
      - get_operations_service
