  8 now takes before every upgrade.
unresolved_assumptions: The console form still predicts 'staff can approve' from the single amount; the
  server enforces the cumulative rule and reports committed_vnd in its refusal. DEC-004's 'per item' versus
  the code's per-line ceiling is an owner question recorded in the packet. An envelope past its TTL but
  still REQUESTED keeps counting as committed (fails safe).
