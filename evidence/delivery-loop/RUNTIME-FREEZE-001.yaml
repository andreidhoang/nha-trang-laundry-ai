  change that authored ADR-0004, so this item's controller job is to verify that state and record
  evidence, applying a corrective edit only if a check fails. No check failed, so no corrective edit was
  required.
rollback_impact: >-
  Reverting this item reverts only the delivery-state transition of RUNTIME-FREEZE-001 itself
  (delivery/WORK_QUEUE.yaml, delivery/LOOP_STATE.yaml, delivery/PROGRAM_PLAN.yaml) and this evidence
  record. The underlying ADR-0004 graph edits were authored in commit 8f070f7 and roll back with that
  commit, at which point the graph returns to routing SECURITY-001 and RUNTIME-PARITY-001 through
  AGENT-001. Nothing under evidence/ was created, modified or destroyed to make this change, so no
  historical record is lost by either rollback. There is no schema migration, database content,
  provider credential, network call, public ingress, outbound send, deployment, real-customer data or
  capability authorization to roll back. Freezing is a scheduling decision and is recorded as one; no
  frozen item was marked COMPLETE, PENDING or READY.
unresolved_assumptions: >-
  Freezing AGENT-001, OPENCLAW-REPACK-001 and RUNTIME-SECURITY-001 does not complete them, resolve
  their blockers or authorize anything. G1 agent evidence is now carried by AGENT-002, which is PENDING,
  blocked by DEC-006, and depends on AGENT-PIPELINE-001, EVAL-CORPUS-001, MODEL-PIN-001,
  PROVIDER-TRANSPORT-001 and this item; none of those has evidence. runtime/openclaw/, the plugin, the
  repack manifests and the OpenClaw jobs in release-supply-chain.yml were deliberately left in place;
  their removal belongs to OPENCLAW-RETIRE-001 and only after RUNTIME-PARITY-001 passes. The separately
  isolated Private Owner OpenClaw trust cell is out of scope. verify_contracts.py continues to report
  ten release blockers and every capability remains NOT_AUTHORIZED. The declared acceptance commands
  were executed with PYTHONPATH set to the nine workspace src directories, because on this macOS host
  the iCloud file provider re-applies the UF_HIDDEN flag to files inside .venv/ within seconds and
  CPython 3.12.11 silently skips any .pth file carrying that flag; without the override the workspace
  packages intermittently vanish from sys.path. The override changes no interpreter, script or
  repository content and is being carried as a separate work item so that gate results stop depending
  on file-flag timing.
