  - DEC-020
  blocking_condition: 'Blocked on DEC-018 and DEC-020 (docs/DECISION_REQUEST_RETENTION_EXECUTION_2026-08.md).
    Not the ledger trigger the packet anticipated: DROP COLUMN was probed live in
    a rolled-back transaction and succeeds under an append-only trigger, which stays
    armed. Policy blocks it. (1) DEC-008 signs webhook payload 30d PURGE and consent
    evidence retained forever; consent_events.evidence_webhook_id NOT NULL makes those
    one row for a STOP message, and DEC-008 does not say which wins. (2) The assistant
    answer is stored again in command_idempotency_records.response, made permanently
    undeletable by protect_idempotency_record, so the 180d transcript purge needs
    a corrective item against the COMPLETE ASSISTANT-001. (3) No GRANT/REVOKE/RLS
    exists in migrations 0001-0027 and apply_demo_grants.py REVOKEs DELETE from the
    API and worker roles, so no identity can purge. Two of ten classes have a separable
    store today; both governed by DEC-018. Three adversarial reviews refuted the design.'
