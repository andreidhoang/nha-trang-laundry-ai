<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b3b36">
    <meta name="description" content="Bảng vận hành nội bộ Giặt Là Sạch Cộng">
    <meta name="referrer" content="no-referrer">

    <!--
      Where this deployment's staff sign in.

      The console is not an OIDC client and cannot become one: the content security policy is
      `connect-src 'self'`, so the browser may not fetch an identity provider's discovery document.
      A session is established by an identity surface that POSTs a bearer token to
      /internal/v1/auth/session and receives HttpOnly cookies. Set the content below to that
      surface's same-origin path to turn the signed-out screen's button on. Left empty, the screen
      explains the flow rather than offering a link that goes nowhere.
    -->
    <meta name="console-signin-path" content="">

    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/print.css" media="print">
    <title>Bảng vận hành</title>
  </head>
  <body>
    <a class="sr-only" href="#main">Bỏ qua điều hướng</a>

    <div class="app">
      <header class="appbar">
        <div class="appbar__identity">
          <p class="appbar__eyebrow">GIẶT LÀ SẠCH CỘNG · NỘI BỘ</p>
          <p class="appbar__title" id="screen-title">Bảng vận hành</p>
        </div>
        <div class="row" id="appbar-actions"></div>
      </header>

      <div class="banners" id="banners"></div>

      <main class="main" id="main" tabindex="-1"></main>

      <nav class="nav" aria-label="Điều hướng chính">
        <ul class="nav__list" id="nav-list"></ul>
      </nav>
    </div>

    <noscript>
      <p class="notice" data-state="danger">
        Bảng vận hành cần JavaScript. Không có bản dự phòng tĩnh, vì mọi số liệu trên màn hình này
        đều do máy chủ tính tại thời điểm hỏi.
      </p>
    </noscript>

    <script type="module" src="app.js"></script>
  </body>
</html>
