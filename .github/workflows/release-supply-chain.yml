name: release-supply-chain

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: runtime/openclaw/public-cell/plugin/package-lock.json
      - name: Install locked workspace
        run: uv sync --all-packages --all-groups --frozen
      - name: Scan committed content locally with gitleaks
        run: |
          mkdir -p artifacts/supply-chain
          docker run --rm --volume "$PWD:/repo:ro" \
            --volume "$PWD/artifacts/supply-chain:/out" \
            ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --exit-code 1 \
            --report-format json --report-path /out/gitleaks.json
      - name: Audit Python dependencies from uv.lock
        run: |
          uv export --frozen --all-packages --no-dev --no-emit-workspace \
            --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit==2.9.0 pip-audit --requirement "$RUNNER_TEMP/requirements.txt" \
            --format json --output artifacts/supply-chain/pip-audit.json
      - name: Audit Node dependencies from package-lock.json
        run: >-
          npm audit --prefix runtime/openclaw/public-cell/plugin --omit=dev --audit-level=high
          --json > artifacts/supply-chain/npm-audit.json
      - name: Audit dependency licenses
        run: >-
          uv run python scripts/audit_dependency_licenses.py
          --package-lock runtime/openclaw/public-cell/plugin/package-lock.json
          --output artifacts/supply-chain/licenses.json
      - name: Install Docker Scout
        uses: docker/scout-action@v1.18.2
        with:
          command: version
      - name: Build exact images and create SBOM/scan evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/supply-chain
          scout_version="$(docker scout version | sed -n 's/^version: v\([^ ]*\).*/\1/p')"
          test -n "$scout_version"
          for service in api worker public-agent-tools; do
            tag="nha-trang-laundry-${service}:candidate"
            docker build --pull=false --file "apps/${service}/Dockerfile" --tag "$tag" .
            image_id="$(docker image inspect "$tag" --format '{{.Id}}')"
            image_ref="nha-trang-laundry-${service}@${image_id}"
            docker scout sbom --format spdx --output "artifacts/supply-chain/${service}.spdx.json" "local://${tag}"
            docker scout cves --only-severity critical,high --format sarif \
              --output "artifacts/supply-chain/${service}.sarif" "local://${tag}"
            uv run python scripts/normalize_container_scan.py \
              --sarif "artifacts/supply-chain/${service}.sarif" \
              --sbom "artifacts/supply-chain/${service}.spdx.json" \
              --sbom-uri "artifacts/supply-chain/${service}.spdx.json" \
              --image-ref "$image_ref" --scanner-version "$scout_version" \
              --evidence-id "SCAN:${service^^}:${GITHUB_RUN_ID}" \
              --output "artifacts/supply-chain/${service}-scan.json"
            printf '%s=%s\n' "$image_ref" "artifacts/supply-chain/${service}-scan.json" \
              >> artifacts/supply-chain/image-bindings.txt
          done
      - name: Assemble and independently verify release evidence
        shell: bash
        run: |
          set -euo pipefail
          image_args=()
          while IFS= read -r binding; do image_args+=(--image "$binding"); done \
            < artifacts/supply-chain/image-bindings.txt
          uv run python scripts/assemble_supply_chain_evidence.py \
            --artifact-root . --commit-sha "$GITHUB_SHA" \
            --secret-scanner-version 8.28.0 \
            --dependency-scanner-version pip-audit-2.9.0+npm-audit \
            --license-scanner-version policy-v1 \
            --lockfile uv.lock \
            --lockfile runtime/openclaw/public-cell/plugin/package-lock.json \
            --secret-report artifacts/supply-chain/gitleaks.json \
            --dependency-report artifacts/supply-chain/pip-audit.json \
            --dependency-report artifacts/supply-chain/npm-audit.json \
            --license-report artifacts/supply-chain/licenses.json \
            "${image_args[@]}" --evidence-id "SUPPLY:${GITHUB_RUN_ID}" \
            --output artifacts/supply-chain/evidence.json
          uv run python scripts/verify_supply_chain_evidence.py \
            --evidence artifacts/supply-chain/evidence.json \
            --expected-commit-sha "$GITHUB_SHA"
      - name: Upload sanitized engineering evidence
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/supply-chain/*.spdx.json
            artifacts/supply-chain/*-scan.json
            artifacts/supply-chain/evidence.json
            artifacts/supply-chain/licenses.json
            artifacts/supply-chain/gitleaks.json
            artifacts/supply-chain/pip-audit.json
            artifacts/supply-chain/npm-audit.json
